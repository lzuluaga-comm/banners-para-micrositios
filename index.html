<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Generador de Banners Bonda</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#f1f5f9;min-height:100vh;color:#1f2937}
.sp::-webkit-scrollbar{width:4px}.sp::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
input[type=range]{width:100%;height:4px;appearance:none;background:#e5e7eb;border-radius:4px;cursor:pointer;accent-color:#2563eb;outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:#2563eb;cursor:pointer}
.tinp{width:100%;padding:7px 10px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;color:#111;background:#fff;outline:none;font-family:inherit}
.sinp{width:100%;padding:6px 8px;border:1px solid #e5e7eb;border-radius:8px;font-size:12px;background:#f9fafb;outline:none;color:#111}
.lbl{font-size:11px;font-weight:600;color:#6b7280;margin-bottom:4px;margin-top:8px;display:block}
.sh{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;display:block}
.tabbar{display:flex;gap:3px;background:#f3f4f6;border-radius:8px;padding:3px;margin-bottom:12px}
.tab{flex:1;padding:5px 4px;font-size:11px;font-weight:700;border:none;cursor:pointer;border-radius:6px;background:transparent;color:#9ca3af;transition:all .15s}
.tab.on{background:#fff;color:#2563eb;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.boldbtn{padding:3px 10px;font-size:13px;font-weight:900;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer;background:#f9fafb;color:#6b7280;font-family:serif;line-height:1.4;flex-shrink:0}
.boldbtn.on{background:#1e40af;color:#fff;border-color:#1e40af}
.alignbtn{padding:3px 8px;font-size:13px;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer;background:#f9fafb;color:#6b7280;line-height:1.4;flex-shrink:0}
.alignbtn.on{background:#1e40af;color:#fff;border-color:#1e40af}
.viewbtn{padding:6px 16px;font-size:12px;font-weight:700;border:none;cursor:pointer;border-radius:7px;background:transparent;color:#9ca3af;transition:all .15s}
.viewbtn.on{background:#fff;color:#2563eb;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid #e5e7eb;flex-shrink:0;transition:all .15s}
.sw.on{border:3px solid #2563eb;box-shadow:0 0 0 2px #bfdbfe}
.bel{position:absolute;cursor:move;user-select:none;z-index:50}
.bel .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:0;background:rgba(30,58,138,.9);color:#fff;font-size:9px;padding:2px 8px;border-radius:4px;white-space:nowrap;z-index:100;font-weight:700;pointer-events:none;font-family:ui-sans-serif,sans-serif}
.bel:hover .tip{display:block}
.bel.sel{outline:2px dashed rgba(37,99,235,.6);outline-offset:2px;border-radius:3px}
.pbg{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.pbox{background:#fff;border-radius:16px;padding:22px 26px;min-width:280px;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.editbar{display:flex;background:#f3f4f6;border-radius:8px;padding:3px;gap:3px;margin-bottom:16px}
.editbtn{flex:1;padding:7px 10px;font-size:12px;font-weight:700;border:none;cursor:pointer;border-radius:6px;background:transparent;color:#9ca3af;transition:all .15s}
.editbtn.on{background:#2563eb;color:#fff;box-shadow:0 1px 4px rgba(37,99,235,.4)}
/* Multicolor segment input */
.seg-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;background:#f8fafc;border-radius:8px;padding:6px 8px}
.seg-text{flex:1;padding:5px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;outline:none;font-family:inherit}
.seg-color{width:28px;height:28px;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer;padding:2px;flex-shrink:0}
.seg-del{width:22px;height:22px;border-radius:50%;background:#fee2e2;color:#dc2626;border:none;cursor:pointer;font-size:14px;line-height:1;font-weight:700;flex-shrink:0}
.seg-add{width:100%;padding:6px;background:#eff6ff;color:#2563eb;border:1px dashed #bfdbfe;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px}
/* Download hide elements */
.hide-on-dl{transition:opacity .1s}
/* Accordion */
.acc{border:1px solid #eef0f3;border-radius:11px;margin-bottom:8px;overflow:hidden;background:#fff}
.acc-h{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;background:#fafbfc;border:none;cursor:pointer;font-size:12.5px;font-weight:700;color:#374151;text-align:left}
.acc-h:hover{background:#f3f4f6}
.acc-h .chev{margin-left:auto;font-size:11px;color:#9ca3af;transition:transform .2s}
.acc.open .acc-h .chev{transform:rotate(90deg)}
.acc-h .ic{font-size:14px;width:18px;text-align:center}
.acc-b{padding:12px 13px 14px;display:none}
.acc.open .acc-b{display:block}
/* Preset chips */
.chip{padding:6px 11px;font-size:11px;font-weight:700;border:1px solid #e5e7eb;border-radius:999px;background:#f9fafb;color:#374151;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#c4b5fd;background:#f5f3ff}
.bgsw{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid #e5e7eb;flex-shrink:0}
.bgsw:hover{border-color:#904AFF}
.tplcard{border:1px solid #e5e7eb;border-radius:10px;padding:9px 8px;cursor:pointer;background:#fff;font-size:11px;font-weight:700;color:#374151;text-align:center}
.tplcard:hover{border-color:#904AFF;background:#f5f3ff}
.fxrow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fxtoggle{position:relative;width:36px;height:20px;border-radius:999px;background:#e5e7eb;cursor:pointer;flex-shrink:0;transition:background .15s}
.fxtoggle.on{background:#904AFF}
.fxtoggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.fxtoggle.on::after{left:18px}
</style>
</head>

// ── CLIPS & EDGE ──────────────────────────────────────────────────────────────
function getClip(fmt){
  const c=C(fmt);
  const a=c.diagAngle!==undefined?c.diagAngle:20; // cutback %
  if(c.clipStyle==='straight'){
    return c.textSide==='right'?'polygon(0 0,100% 0,100% 100%,0 100%)':'polygon(0 0,100% 0,100% 100%,0 100%)';
  }
  if(c.textSide==='right'){
    if(c.clipStyle==='diagonal-right') return `polygon(${a}% 0,100% 0,100% 100%,0 100%)`;
    return `polygon(0 0,100% 0,100% 100%,${a}% 100%)`;
  } else {
    if(c.clipStyle==='diagonal-right') return `polygon(0 0,100% 0,${100-a}% 100%,0 100%)`;
    return `polygon(0 0,${100-a}% 0,100% 100%,0 100%)`;
  }
}
function getEdge(fmt){
  const c=C(fmt); if(c.edgeEffect==='none')return'none';
  const s=c.textSide==='left'?1:-1;
  return({shadow:`drop-shadow(${s*8}px 0 12px rgba(0,0,0,.5))`,glow:`drop-shadow(${s*2}px 0 10px rgba(255,255,255,.6))`,'solid-white':`drop-shadow(${s*4}px 0 0 #fff)`})[c.edgeEffect]||'none';
}

function applyTemplate(id){
  const t=TEMPLATES.find(x=>x.id===id); if(!t)return;
  const c=E();

  c.layersOn=false; c.starsOn=false;

  t.apply(c); reRender();
}

// ── EFFECT GEOMETRY (shared by DOM preview + canvas export) ───────────────────
// Deterministic pseudo-random so preview and export match exactly.
function seededRand(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646;
  return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
// Returns star positions (in BW×BH space) given intensity.
function starField(BW,BH,intensity){
  const rnd=seededRand(7); const n=Math.round(8+intensity/100*42);
  const arr=[];
  for(let i=0;i<n;i++){
    arr.push({x:rnd()*BW, y:rnd()*BH, r:(0.6+rnd()*1.8)*(0.7+intensity/100), o:0.3+rnd()*0.6});
  }
  return arr;
}
function blobField(BW,BH,intensity){
  const rnd=seededRand(19); const n=Math.round(2+intensity/100*4);
  const arr=[];
  for(let i=0;i<n;i++){
    arr.push({x:rnd()*BW, y:rnd()*BH, r:(BH*0.25+rnd()*BH*0.45)*(0.6+intensity/100), o:0.10+intensity/100*0.22});
  }
  return arr;
}
// Wave band path data (bottom franja, brand resource)
function wavePath(BW,BH,intensity){
  const amp=BH*(0.04+intensity/100*0.10);
  const baseY=BH-amp*2-BH*(intensity/100*0.04);
  let d=`M0 ${baseY}`;
  const seg=BW/4;
  for(let i=0;i<4;i++){
    const x0=i*seg, x1=(i+1)*seg, mid=x0+seg/2;
    const up=i%2===0?-amp:amp;
    d+=` Q ${mid} ${baseY+up} ${x1} ${baseY}`;
  }
  d+=` L ${BW} ${BH} L 0 ${BH} Z`;
  return {d, baseY};
}

// ── DRAG ─────────────────────────────────────────────────────────────────────
let _drag=null;
function startDrag(e,elId,fmt){
  const isT=e.type==='touchstart';if(!isT&&e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  const cx=isT?e.touches[0].clientX:e.clientX;
  const cy=isT?e.touches[0].clientY:e.clientY;
  const bw=$('bw-'+fmt);if(!bw)return;
  const rect=bw.getBoundingClientRect();
  const cur=C(fmt).pos[elId];
  document.querySelectorAll('.bel').forEach(d=>d.classList.remove('sel'));
  $('be-'+fmt+'-'+elId)?.classList.add('sel');
  _drag={elId,fmt,sx:100/rect.width,sy:100/rect.height,cx,cy,px:cur.xp,py:cur.yp};
}
function onMv(e){
  if(!_drag)return;
  const isT=e.type==='touchmove';if(isT)e.preventDefault();
  const cx=isT?e.touches[0].clientX:e.clientX;
  const cy=isT?e.touches[0].clientY:e.clientY;
  const nx=_drag.px+(cx-_drag.cx)*_drag.sx;
  const ny=_drag.py+(cy-_drag.cy)*_drag.sy;
  // Clamp so elements don't go too far off-screen
  const nxp=Math.max(-30,Math.min(120,nx));
  const nyp=Math.max(-10,Math.min(110,ny));
  C(_drag.fmt).pos[_drag.elId]={xp:nxp,yp:nyp};
  const el=$('be-'+_drag.fmt+'-'+_drag.elId);
  if(el){el.style.left=nxp+'%';el.style.top=nyp+'%';}
}
function onUp(){_drag=null;}
document.addEventListener('mousemove',onMv);
document.addEventListener('mouseup',onUp);
document.addEventListener('touchmove',onMv,{passive:false});
document.addEventListener('touchend',onUp);

// ── BUILD BANNER BACKGROUND ───────────────────────────────────────────────────
function buildBg(fmt){
  const c=C(fmt);
  const isMob=fmt==='mobile'; const BW=isMob?984:1166, BH=isMob?450:338;
  const bg=mk('div');bg.id='bb-'+fmt;css(bg,{position:'absolute',inset:'0',overflow:'hidden'});

  // ── LAYERED BACKGROUND (full-bleed diagonal color bands, à la Starbucks) ──
  if(c.layersOn){
    const svgNS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox',`0 0 ${BW} ${BH}`);
    svg.setAttribute('preserveAspectRatio','none');
    css(svg,{position:'absolute',inset:'0',width:'100%',height:'100%'});
    layerBands(c,BW,BH).forEach(band=>{
      const p=document.createElementNS(svgNS,'path');
      p.setAttribute('d',band.d); p.setAttribute('fill',band.color);
      svg.appendChild(p);
    });
    bg.appendChild(svg);
  }

  // Base color fill behind the image, so wherever the image fades or blends,
  // the brand color shows through (never white/empty). When the layered
  // background is on, the LAYERS are that base — don't cover them.
  const bgColorCss = c.useGrad?`linear-gradient(to right,${c.colorA},${c.colorB})`:c.colorA;
  if(c.bgImg && !c.layersOn){
    const base=mk('div');css(base,{position:'absolute',inset:'0',background:bgColorCss});
    bg.appendChild(base);
  }

  if(c.bgImg){
    const img=mk('img');img.src=c.bgImg;
    const blendMap={multiply:'multiply',screen:'screen',overlay:'overlay','soft-light':'soft-light',luminosity:'luminosity'};
    const imgCss={position:'absolute',maxWidth:'none',width:(c.zoom*100)+'%',height:'auto',
      left:c.posX+'%',top:c.posY+'%',transform:'translate(-50%,-50%)',display:'block',
      opacity:String((c.bgImgOpacity!==undefined?c.bgImgOpacity:100)/100)};
    if(blendMap[c.bgBlend]) imgCss.mixBlendMode=blendMap[c.bgBlend];

    // "Degradado" / fade: feather the IMAGE itself to transparent toward the
    // text side using a mask. This keeps the image crisp where it matters and
    // lets it melt into the brand color — instead of painting color over it.
    if(c.bgBlend==='fade'){
      const strength=(c.bgBlendInt!==undefined?c.bgBlendInt:60)/100; // 0..1
      // The image stays fully opaque from the far edge, then fades out as it
      // approaches the text side. Larger strength = longer/softer fade.
      const solid=Math.round((1-strength)*48);            // % kept fully opaque
      const gone=Math.min(100,solid+Math.round(20+strength*55)); // % fully gone
      const ang = c.bgBlendDir==='right' ? 270
                : c.bgBlendDir==='top' ? 180
                : c.bgBlendDir==='bottom' ? 0
                : c.bgBlendDir==='diag-right' ? 315
                : c.bgBlendDir==='diag-left' ? 225
                : 90; // left (default): opaque on right, fades toward left
      // opaque far side → transparent near text side
      const m2=`linear-gradient(${ang}deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) ${solid*0.4}%, rgba(0,0,0,1) ${gone}%, rgba(0,0,0,1) 100%)`;
      imgCss.webkitMaskImage=m2; imgCss.maskImage=m2;
      imgCss.webkitMaskRepeat='no-repeat'; imgCss.maskRepeat='no-repeat';
      imgCss.webkitMaskSize='100% 100%'; imgCss.maskSize='100% 100%';
    }
    css(img,imgCss);
    bg.appendChild(img);
  }
  const pw=(c.panelW||63)+'%';
  const po=mk('div');css(po,{position:'absolute',top:'0',height:'100%',width:pw,[c.textSide==='left'?'left':'right']:'0',filter:getEdge(fmt)});
  const pi=mk('div');css(pi,{position:'relative',width:'100%',height:'100%',clipPath:getClip(fmt),overflow:'hidden',
    background:c.useGrad?`linear-gradient(to right,${c.colorA},${c.colorB})`:c.colorA});

  // ── EFFECTS OVERLAY ──
  // Normally effects live inside the color panel (clipped to it). With the
  // layered background on, there is no panel, so effects render full-bleed
  // over the whole piece (layers + image).
  const fullBleed = c.layersOn;
  const fxTarget = fullBleed ? bg : pi;          // where to attach effect nodes
  const fxW = fullBleed ? BW : (c.panelW||63)/100*BW; // effect field width
  const panelPx = fxW;
  if(c.fxGlow){
    const g=mk('div');
    const gx = fullBleed ? '50%' : (c.textSide==='left'?'30%':'70%');
    css(g,{position:'absolute',inset:'0',pointerEvents:'none',
      background:`radial-gradient(circle at ${gx} 45%, ${c.fxGlowColor}${alphaHex(0.12+c.fxGlowInt/100*0.38)} 0%, transparent 60%)`});
    fxTarget.appendChild(g);
  }
  if(c.fxBlobs || c.fxStars || c.fxWaves){
    const svgNS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox',`0 0 ${panelPx} ${BH}`);
    svg.setAttribute('preserveAspectRatio','none');
    css(svg,{position:'absolute',inset:'0',width:'100%',height:'100%',pointerEvents:'none'});
    if(c.fxBlobs){
      blobField(panelPx,BH,c.fxBlobsInt).forEach(b=>{
        const ci=document.createElementNS(svgNS,'circle');
        ci.setAttribute('cx',b.x);ci.setAttribute('cy',b.y);ci.setAttribute('r',b.r);
        ci.setAttribute('fill',c.fxBlobsColor);ci.setAttribute('opacity',b.o);
        svg.appendChild(ci);
      });
    }
    if(c.fxWaves){
      const wp=wavePath(panelPx,BH,c.fxWavesInt);
      const p=document.createElementNS(svgNS,'path');
      p.setAttribute('d',wp.d);p.setAttribute('fill',c.fxWavesColor);
      p.setAttribute('opacity',(0.12+c.fxWavesInt/100*0.20).toFixed(3));
      svg.appendChild(p);
    }
    if(c.fxStars){
      starField(panelPx,BH,c.fxStarsInt).forEach(s=>{
        const ci=document.createElementNS(svgNS,'circle');
        ci.setAttribute('cx',s.x);ci.setAttribute('cy',s.y);ci.setAttribute('r',s.r);
        ci.setAttribute('fill',c.fxStarsColor);ci.setAttribute('opacity',s.o.toFixed(2));
        svg.appendChild(ci);
      });
    }
    fxTarget.appendChild(svg);
  }

  po.appendChild(pi);
  if(!c.layersOn) bg.appendChild(po);
  return bg;
}
// hex alpha helper: returns 2-digit hex alpha for an 0-1 value (append to #rrggbb)
function alphaHex(a){ const v=Math.max(0,Math.min(255,Math.round(a*255))); return v.toString(16).padStart(2,'0'); }
// ── LAYERED BACKGROUND BANDS (diagonal color strips, à la Starbucks) ──────────
// Returns [{d, color}] covering the whole BW×BH. First color fills the top,
// each subsequent color is a band stacked toward the bottom with a diagonal edge.
function layerBands(c,BW,BH){
  const cols=(c.layersColors&&c.layersColors.length?c.layersColors:['#0a6b4f','#0d7d5c','#10906a','#13a378']);
  const n=cols.length;
  const slant=(c.layersAngle||8)/100*BH;   // vertical offset of the diagonal edge
  const bands=[];
  // Base: full rectangle of the first color
  bands.push({d:`M0 0 L${BW} 0 L${BW} ${BH} L0 ${BH} Z`, color:cols[0]});
  // Each next color: a band whose TOP edge is a diagonal line, filled to the bottom.
  // Bands start lower and lower so earlier colors remain visible at top.
  for(let i=1;i<n;i++){
    const frac=i/n;                          // 0..1 down the canvas
    const yTop=BH*frac;                       // nominal top of this band
    const dir = (c.layersStyle==='diagonal-left') ? -1 : 1;
    const yL = yTop + dir*slant;              // left edge y
    const yR = yTop - dir*slant;              // right edge y
    bands.push({
      d:`M0 ${yL.toFixed(1)} L${BW} ${yR.toFixed(1)} L${BW} ${BH} L0 ${BH} Z`,
      color:cols[i]
    });
  }
  return bands;
}
// hex (#rgb / #rrggbb) → rgba() string with given alpha
function hexToRgba(hex,a){
  let h=(hex||'#000000').replace('#','');
  if(h.length===3) h=h.split('').map(x=>x+x).join('');
  const r=parseInt(h.substr(0,2),16)||0, g=parseInt(h.substr(2,2),16)||0, b=parseInt(h.substr(4,2),16)||0;
  return `rgba(${r},${g},${b},${a})`;
}

// ── ELEMENT EFFECTS (product / client image) ─────────────────────────────────
// Diagonal clip + feather/fade mask + shadow/glow + opacity. Returns a CSS obj.
// The canvas export replicates this with the SAME numeric logic (see helpers).
function elemClipPath(shape,dir){
  // Returns a CSS polygon() clip-path or '' for no clip. Diagonal cuts one side.
  if(shape!=='diagonal') return '';
  // cut amount as fraction of width
  const cut=0.22;
  if(dir==='diag-left'){
    // top-left cut down to bottom-left straight (slants ↙)
    return `polygon(0% 0%, 100% 0%, 100% 100%, ${cut*100}% 100%)`;
  }
  // diag-right (default): slants ↘
  return `polygon(${cut*100}% 0%, 100% 0%, 100% 100%, 0% 100%)`;
}
function elemFadeMask(fade,dir){
  // fade 0..100 → mask gradient that feathers the element toward `dir`.
  const f=(fade||0)/100; if(f<=0) return '';
  const ang = dir==='right' ? 270 : dir==='top' ? 180 : dir==='bottom' ? 0
            : dir==='diag-right' ? 315 : dir==='diag-left' ? 225 : 90; // left default
  const solid=Math.round((1-f)*55);
  const gone=Math.min(100,solid+Math.round(15+f*55));
  return `linear-gradient(${ang}deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) ${Math.round(solid*0.3)}%, rgba(0,0,0,1) ${gone}%, rgba(0,0,0,1) 100%)`;
}
function elemEffectCss(shape,shapeDir,fade,fadeDir,shadow,glow,glowColor,opacity){
  const o={};
  const clip=elemClipPath(shape,shapeDir);
  if(clip){ o.clipPath=clip; o.webkitClipPath=clip; }
  const mask=elemFadeMask(fade,fadeDir);
  if(mask){ o.webkitMaskImage=mask; o.maskImage=mask; o.webkitMaskSize='100% 100%'; o.maskSize='100% 100%'; o.webkitMaskRepeat='no-repeat'; o.maskRepeat='no-repeat'; }
  const filters=[];
  if(shadow) filters.push('drop-shadow(0 8px 20px rgba(0,0,0,.35))');
  if(glow)   filters.push('drop-shadow(0 0 14px '+hexToRgba(glowColor||'#904AFF',0.85)+')');
  if(!shadow && !glow) filters.push('drop-shadow(0 8px 20px rgba(0,0,0,.30))'); // default soft shadow
  o.filter=filters.join(' ');
  o.opacity=String((opacity!==undefined?opacity:100)/100);
  return o;
}

// ── 5-POINT STAR PATH (centered at cx,cy, outer radius = size) ────────────────
function star5Path(cx,cy,size){
  const outer=size, inner=size*0.42, pts=5;
  let d='';
  for(let i=0;i<pts*2;i++){
    const r=i%2===0?outer:inner;
    const ang=(Math.PI/pts)*i - Math.PI/2;
    const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
    d+=(i===0?'M':'L')+x.toFixed(2)+' '+y.toFixed(2)+' ';
  }
  return d+'Z';
}
// Deterministic star cluster. Scattered like the reference image, sizes vary,
// edges fade. Returns {w,h,stars:[{x,y,s,o}]} in its own local box space.
function starsClusterBox(c){
  const base=(c.starsScale||60);          // controls star size
  const spread=(c.starsSpread||70)/100;   // 0..1 how spread out
  const n=Math.max(4,Math.round(c.starsCount||40));
  const rnd=seededRand(101);
  // box grows with count + spread
  const W=Math.round(base*4 + base*6*spread);
  const H=Math.round(base*2.4 + base*4*spread);
  const cx=W/2, cy=H/2;
  const stars=[];
  for(let i=0;i<n;i++){
    // distribute in a soft disc, denser toward a diagonal band (like reference)
    const t=rnd(), u=rnd();
    const rx=(u-0.5)*W, ry=(t-0.5)*H;
    const x=cx+rx, y=cy+ry;
    // size: smaller toward edges
    const distN=Math.min(1,Math.hypot(rx/(W/2),ry/(H/2)));
    const s=base*0.10*(1.1-distN*0.5)*(0.6+rnd()*0.8);
    const o=(c.starsOpacity||80)/100*(1-distN*0.35)*(0.55+rnd()*0.45);
    stars.push({x,y,s:Math.max(1.5,s),o:Math.max(0.06,Math.min(1,o))});
  }
  return {w:W,h:H,stars};
}


// ── BUILD BANNER WRAPPER ──────────────────────────────────────────────────────
function buildBanner(fmt){
  const isMob=fmt==='mobile';const BW=isMob?984:1166,BH=isMob?450:338;
  // Outer container: fits the layout, maintains aspect ratio
  const outer=mk('div');outer.id='bw-'+fmt;
  css(outer,{position:'relative',width:'100%',aspectRatio:BW+'/'+BH,overflow:'hidden'});
  // Inner wrapper: native size, scaled down via CSS transform
  const inner=mk('div');inner.id='bi-'+fmt;
  css(inner,{position:'absolute',top:'0',left:'0',
    width:BW+'px',height:BH+'px',
    transformOrigin:'top left',
    // Scale will be applied by updateScale()
  });
  inner.appendChild(buildBg(fmt));buildElems(fmt,inner);
  outer.appendChild(inner);
  // Apply scale after a frame so dimensions are known
  requestAnimationFrame(()=>{
    const r=outer.getBoundingClientRect();
    if(r.width>0) inner.style.transform='scale('+(r.width/BW)+')';
  });
  return outer;
}

// Recompute scale when window resizes
window.addEventListener('resize',()=>{
  ['desktop','mobile'].forEach(fmt=>{
    const outer=$('bw-'+fmt);const inner=$('bi-'+fmt);
    if(!outer||!inner)return;
    const isMob=fmt==='mobile';const BW=isMob?984:1166;
    const r=outer.getBoundingClientRect();
    if(r.width>0)inner.style.transform='scale('+(r.width/BW)+')';
  });
});

// ── DOWNLOAD (high quality, no UI artifacts) ──────────────────────────────────
// quality: 'png' = lossless 4x PNG (best), 'hd' = 4x JPEG q.95, 'std' = 3x JPEG (light)
// opts.returnDataUrl: if true, returns a data URL instead of triggering download
//   (used to build history thumbnails; pass opts.thumbScale to downscale).
async function dlBanner(fmt, quality, opts){
  opts = opts || {};
  quality = quality || 'png';
  const returnMode = !!opts.returnDataUrl;
  const btn = returnMode ? null : $('dl-'+fmt);
  const prevTxt = btn ? btn.textContent : '';
  if(btn){btn.textContent='Procesando...';btn.disabled=true;}

  const isMob = fmt==='mobile';
  const BW = isMob ? 984 : 1166;
  const BH = isMob ? 450 : 338;
  const SCALE = opts.thumbScale ? opts.thumbScale : ((quality==='std') ? 3 : 4);
  const OW = Math.round(BW*SCALE), OH = Math.round(BH*SCALE);

  try{
    const c = C(fmt);
    await document.fonts.ready;
    await new Promise(r=>requestAnimationFrame(r));

    const wrap = $('bw-'+fmt);
    const rect = wrap.getBoundingClientRect();
    const dispW = rect.width;
    const dispH = rect.height;
    // The DOM preview's inner wrapper is exactly BW px wide (then visually
    // scaled down via CSS transform), so font sizes and positions live in
    // BW-space. We draw the canvas in that same BW-space → FS must be 1 so the
    // export matches the draggable preview pixel-for-pixel.
    const FS = 1; // BW-space; positions come from c.pos (% of BW/BH)

    const out = document.createElement('canvas');
    out.width = OW; out.height = OH;
    const ctx = out.getContext('2d');
    ctx.scale(SCALE,SCALE); // draw in BW×BH space, output at SCALE×

    // Fill entire canvas with base color first (no black/transparent areas)
    if(c.useGrad){
      const gFull=ctx.createLinearGradient(0,0,BW,0);
      gFull.addColorStop(0,c.colorA); gFull.addColorStop(1,c.colorB);
      ctx.fillStyle=gFull;
    } else { ctx.fillStyle=c.colorA; }
    ctx.fillRect(0,0,BW,BH);

    // ── LAYERED BACKGROUND (full-bleed diagonal bands) ──────────────────────
    if(c.layersOn){
      layerBands(c,BW,BH).forEach(band=>{
        ctx.fillStyle=band.color;
        const m=band.d.match(/-?\d+(?:\.\d+)?/g).map(Number);
        // d format: M x0 y0 L x1 y1 L x2 y2 L x3 y3 Z  (4 points)
        ctx.beginPath();
        ctx.moveTo(m[0],m[1]); ctx.lineTo(m[2],m[3]); ctx.lineTo(m[4],m[5]); ctx.lineTo(m[6],m[7]);
        ctx.closePath(); ctx.fill();
      });
    }

    // ── 1. BACKGROUND IMAGE ─────────────────────────────────────────────────
    if(c.bgImg){
      // Base color fill behind the image, UNLESS the layered bg is on (then the
      // already-drawn layers are the base and must show through the fade).
      const baseFill=()=>{
        if(c.useGrad){ const g=ctx.createLinearGradient(0,0,BW,0); g.addColorStop(0,c.colorA); g.addColorStop(1,c.colorB); return g; }
        return c.colorA;
      };
      if(!c.layersOn){ ctx.fillStyle=baseFill(); ctx.fillRect(0,0,BW,BH); }
      await new Promise(res=>{
        const img=new Image(); img.crossOrigin='anonymous';
        img.onload=()=>{
          const cssW = c.zoom * BW;
          const cssH = img.naturalHeight * (cssW / img.naturalWidth);
          const cx = c.posX/100*BW;
          const cy = c.posY/100*BH;
          const dx=cx-cssW/2, dy=cy-cssH/2;
          const blendCanvasMap={multiply:'multiply',screen:'screen',overlay:'overlay','soft-light':'soft-light',luminosity:'luminosity'};
          const alpha=(c.bgImgOpacity!==undefined?c.bgImgOpacity:100)/100;

          if(c.bgBlend==='fade'){
            // Render the image to a temp canvas, then erase toward the text side
            // with a gradient (destination-out) — mirrors the DOM mask.
            const tmp=document.createElement('canvas'); tmp.width=BW; tmp.height=BH;
            const tc=tmp.getContext('2d');
            tc.globalAlpha=alpha;
            tc.drawImage(img, dx, dy, cssW, cssH);
            tc.globalAlpha=1;
            const strength=(c.bgBlendInt!==undefined?c.bgBlendInt:60)/100;
            const solid=(1-strength)*0.48;
            const gone=Math.min(1,solid+0.20+strength*0.55);
            // gradient direction vector (matches the DOM angle mapping)
            let x0,y0,x1,y1;
            const dir=c.bgBlendDir||'left';
            if(dir==='right'){ x0=0;y0=0;x1=BW;y1=0; }
            else if(dir==='top'){ x0=0;y0=BH;x1=0;y1=0; }
            else if(dir==='bottom'){ x0=0;y0=0;x1=0;y1=BH; }
            else if(dir==='diag-right'){ x0=BW;y0=0;x1=0;y1=BH; }
            else if(dir==='diag-left'){ x0=0;y0=0;x1=BW;y1=BH; }
            else { x0=BW;y0=0;x1=0;y1=0; } // left default: erase toward left
            const mg=tc.createLinearGradient(x0,y0,x1,y1);
            // erase (alpha=1) at the text side, keep (alpha=0) at far side
            mg.addColorStop(0, 'rgba(0,0,0,0)');
            mg.addColorStop(Math.max(0,Math.min(1,solid*0.4)), 'rgba(0,0,0,0)');
            mg.addColorStop(Math.max(0,Math.min(1,gone)), 'rgba(0,0,0,1)');
            mg.addColorStop(1, 'rgba(0,0,0,1)');
            tc.globalCompositeOperation='destination-out';
            tc.fillStyle=mg; tc.fillRect(0,0,BW,BH);
            // stamp the feathered image onto the main canvas
            ctx.drawImage(tmp,0,0);
          } else {
            ctx.save();
            ctx.globalAlpha=alpha;
            if(blendCanvasMap[c.bgBlend]) ctx.globalCompositeOperation=blendCanvasMap[c.bgBlend];
            ctx.drawImage(img, dx, dy, cssW, cssH);
            ctx.restore();
          }
          res();
        };
        img.onerror=res; img.src=c.bgImg;
      });
    }

    // ── 2. COLOR PANEL WITH DIAGONAL CLIP ───────────────────────────────────
    const pw = (c.panelW||63)/100 * BW;
    const isR = c.textSide==='right';
    const da = (c.diagAngle!==undefined ? c.diagAngle : 20) / 100;

    // Gradient spans the panel width
    const _gradEnd = c.textSide==='right' ? BW : pw;
    const _gradStart = c.textSide==='right' ? BW-pw : 0;
    const bgFill = c.useGrad
      ? (()=>{ const g=ctx.createLinearGradient(_gradStart,0,_gradEnd,0); g.addColorStop(0,c.colorA); g.addColorStop(1,c.colorB); return g; })()
      : c.colorA;

    // Skip the colored panel entirely when the layered background is on.
    if(!c.layersOn){
    // Build clip polygon matching CSS clip-path exactly
    ctx.save();
    ctx.beginPath();
    if(!isR){
      if(c.clipStyle==='diagonal-right'){
        ctx.moveTo(0,0); ctx.lineTo(pw,0); ctx.lineTo(pw*(1-da),BH); ctx.lineTo(0,BH);
      } else if(c.clipStyle==='diagonal-left'){
        ctx.moveTo(0,0); ctx.lineTo(pw*(1-da),0); ctx.lineTo(pw,BH); ctx.lineTo(0,BH);
      } else {
        ctx.rect(0,0,pw,BH);
      }
    } else {
      const x0 = BW-pw;
      if(c.clipStyle==='diagonal-right'){
        ctx.moveTo(x0+pw*da,0); ctx.lineTo(BW,0); ctx.lineTo(BW,BH); ctx.lineTo(x0,BH);
      } else if(c.clipStyle==='diagonal-left'){
        ctx.moveTo(x0,0); ctx.lineTo(BW,0); ctx.lineTo(BW,BH); ctx.lineTo(x0+pw*da,BH);
      } else {
        ctx.rect(x0,0,pw,BH);
      }
    }
    ctx.closePath();
    ctx.fillStyle = bgFill;
    ctx.fill();

    // ── Edge effects ──────────────────────────────────────────────────────────
    if(c.edgeEffect !== 'none'){
      // Build same polygon path
      function edgePath(){
        ctx.beginPath();
        if(!isR){
          if(c.clipStyle==='diagonal-right'){ctx.moveTo(0,0);ctx.lineTo(pw,0);ctx.lineTo(pw*(1-da),BH);ctx.lineTo(0,BH);}
          else if(c.clipStyle==='diagonal-left'){ctx.moveTo(0,0);ctx.lineTo(pw*(1-da),0);ctx.lineTo(pw,BH);ctx.lineTo(0,BH);}
          else{ctx.rect(0,0,pw,BH);}
        } else {
          const x0=BW-pw;
          if(c.clipStyle==='diagonal-right'){ctx.moveTo(x0+pw*da,0);ctx.lineTo(BW,0);ctx.lineTo(BW,BH);ctx.lineTo(x0,BH);}
          else if(c.clipStyle==='diagonal-left'){ctx.moveTo(x0,0);ctx.lineTo(BW,0);ctx.lineTo(BW,BH);ctx.lineTo(x0+pw*da,BH);}
          else{ctx.rect(x0,0,pw,BH);}
        }
        ctx.closePath();
      }

      if(c.edgeEffect==='solid-white'){
        // Draw white line along the diagonal edge
        ctx.save();
        ctx.beginPath();
        if(!isR){
          if(c.clipStyle==='diagonal-right'){ctx.moveTo(pw,0);ctx.lineTo(pw*(1-da),BH);}
          else if(c.clipStyle==='diagonal-left'){ctx.moveTo(pw*(1-da),0);ctx.lineTo(pw,BH);}
          else{ctx.moveTo(pw,0);ctx.lineTo(pw,BH);}
        } else {
          const x0=BW-pw;
          if(c.clipStyle==='diagonal-right'){ctx.moveTo(x0+pw*da,0);ctx.lineTo(x0,BH);}
          else if(c.clipStyle==='diagonal-left'){ctx.moveTo(x0,0);ctx.lineTo(x0+pw*da,BH);}
          else{ctx.moveTo(x0,0);ctx.lineTo(x0,BH);}
        }
        ctx.strokeStyle='rgba(255,255,255,0.9)';
        ctx.lineWidth=4;
        ctx.stroke();
        ctx.restore();

      } else if(c.edgeEffect==='shadow' || c.edgeEffect==='glow'){
        // Draw the panel shape AGAIN with shadow, then overdraw with no-shadow version
        // This produces the shadow effect on the edge without affecting the fill
        const shadowColor = c.edgeEffect==='shadow'
          ? 'rgba(0,0,0,0.65)'
          : 'rgba(255,255,255,0.75)';
        const offsetDir = isR ? -1 : 1;

        // Pass 1: filled panel with shadow
        ctx.save();
        ctx.shadowColor   = shadowColor;
        ctx.shadowBlur    = 22;
        ctx.shadowOffsetX = offsetDir * 12;
        ctx.shadowOffsetY = 0;
        edgePath();
        ctx.fillStyle = bgFill;
        ctx.fill();
        ctx.restore();

        // Pass 2: redraw panel WITHOUT shadow to restore clean fill
        ctx.save();
        ctx.shadowColor = 'transparent';
        edgePath();
        ctx.fillStyle = bgFill;
        ctx.fill();
        ctx.restore();
      }
    }
    } // end if(!c.layersOn) — panel drawing

    // ── 2b. EFFECTS (glow / blobs / waves / stars) ──────────────────────────
    // Clipped to the color panel normally; full-bleed when layered bg is on.
    if(c.fxGlow || c.fxBlobs || c.fxWaves || c.fxStars){
      const fullBleed = c.layersOn;
      const panelX0 = fullBleed ? 0 : (isR ? (BW-pw) : 0);
      const effW = fullBleed ? BW : pw;
      ctx.save();
      ctx.beginPath();
      if(fullBleed){
        ctx.rect(0,0,BW,BH);
      } else if(!isR){
        if(c.clipStyle==='diagonal-right'){ctx.moveTo(0,0);ctx.lineTo(pw,0);ctx.lineTo(pw*(1-da),BH);ctx.lineTo(0,BH);}
        else if(c.clipStyle==='diagonal-left'){ctx.moveTo(0,0);ctx.lineTo(pw*(1-da),0);ctx.lineTo(pw,BH);ctx.lineTo(0,BH);}
        else{ctx.rect(0,0,pw,BH);}
      } else {
        const x0=BW-pw;
        if(c.clipStyle==='diagonal-right'){ctx.moveTo(x0+pw*da,0);ctx.lineTo(BW,0);ctx.lineTo(BW,BH);ctx.lineTo(x0,BH);}
        else if(c.clipStyle==='diagonal-left'){ctx.moveTo(x0,0);ctx.lineTo(BW,0);ctx.lineTo(BW,BH);ctx.lineTo(x0+pw*da,BH);}
        else{ctx.rect(x0,0,pw,BH);}
      }
      ctx.closePath(); ctx.clip();

      // GLOW (radial)
      if(c.fxGlow){
        const gx = fullBleed ? BW*0.5 : panelX0 + (c.textSide==='left'?pw*0.30:pw*0.70);
        const gy = BH*0.45;
        const gr = Math.max(effW,BH)*0.75;
        const rg = ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
        const a = (0.12+c.fxGlowInt/100*0.38);
        rg.addColorStop(0, hexToRgba(c.fxGlowColor,a));
        rg.addColorStop(1, hexToRgba(c.fxGlowColor,0));
        ctx.fillStyle=rg; ctx.fillRect(panelX0,0,effW,BH);
      }
      // BLOBS
      if(c.fxBlobs){
        blobField(effW,BH,c.fxBlobsInt).forEach(b=>{
          ctx.beginPath();
          ctx.arc(panelX0+b.x,b.y,b.r,0,Math.PI*2);
          ctx.fillStyle=hexToRgba(c.fxBlobsColor,b.o);
          ctx.fill();
        });
      }
      // WAVES (bottom franja)
      if(c.fxWaves){
        const wp=wavePath(effW,BH,c.fxWavesInt);
        ctx.beginPath();
        const seg=effW/4; const amp=BH*(0.04+c.fxWavesInt/100*0.10);
        const baseY=wp.baseY;
        ctx.moveTo(panelX0,baseY);
        for(let i=0;i<4;i++){
          const x1=panelX0+(i+1)*seg, mid=panelX0+i*seg+seg/2;
          const up=i%2===0?-amp:amp;
          ctx.quadraticCurveTo(mid,baseY+up,x1,baseY);
        }
        ctx.lineTo(panelX0+effW,BH); ctx.lineTo(panelX0,BH); ctx.closePath();
        ctx.fillStyle=hexToRgba(c.fxWavesColor,(0.12+c.fxWavesInt/100*0.20));
        ctx.fill();
      }
      // STARS
      if(c.fxStars){
        starField(effW,BH,c.fxStarsInt).forEach(s=>{
          ctx.beginPath();
          ctx.arc(panelX0+s.x,s.y,s.r,0,Math.PI*2);
          ctx.fillStyle=hexToRgba(c.fxStarsColor,s.o);
          ctx.fill();
        });
      }
      ctx.restore();
    }
    function fontStr(font,size,bold,italic){
      return `${italic?'italic ':''} ${bold?'700':'300'} ${size}px "${font==='Moranga'?'Moranga':'CerebriSans"'}`;
    }
    function drawSegs(segs, x, y, size, font, bold, italic, align){
      ctx.save();
      ctx.font=fontStr(font,size,bold,italic);
      ctx.textBaseline='top';
      let totalW=0;
      segs.forEach(s=>{if(s.text) totalW+=ctx.measureText(s.text).width;});
      let ox = x; // position comes from drag; alignment only affects HTML preview
      segs.forEach(seg=>{
        if(!seg.text) return;
        ctx.fillStyle=seg.color;
        if(bold){ ctx.fillText(seg.text,ox+0.4,y); ctx.fillText(seg.text,ox-0.4,y); }
        ctx.fillText(seg.text,ox,y);
        ox+=ctx.measureText(seg.text).width;
      });
      ctx.restore();
      return totalW;
    }
    function roundRect(x,y,w,h,r,fill){
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
      ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
      ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
      ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
      ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
      ctx.restore();
    }
    // Draw an image element (product/client) with diagonal clip, feather/fade,
    // shadow/glow and opacity — mirrors the DOM elemEffectCss exactly.
    function drawElementWithEffects(ctx, img, cx, cy, dw, dh, rotDeg, opt){
      const FS=opt.FS||1;
      // 1) Render image (+ clip + fade) into an offscreen canvas at element size.
      const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));
      const tmp=document.createElement('canvas'); tmp.width=tw; tmp.height=th;
      const tc=tmp.getContext('2d');
      // diagonal clip
      if(opt.shape==='diagonal'){
        const cut=0.22*tw;
        tc.beginPath();
        if(opt.shapeDir==='diag-left'){
          tc.moveTo(0,0); tc.lineTo(tw,0); tc.lineTo(tw,th); tc.lineTo(cut,th);
        } else {
          tc.moveTo(cut,0); tc.lineTo(tw,0); tc.lineTo(tw,th); tc.lineTo(0,th);
        }
        tc.closePath(); tc.clip();
      }
      tc.imageSmoothingEnabled=true; tc.imageSmoothingQuality='high';
      tc.drawImage(img,0,0,tw,th);
      // feather/fade via destination-out gradient
      const f=(opt.fade||0)/100;
      if(f>0){
        const dir=opt.fadeDir||'left';
        let x0,y0,x1,y1;
        if(dir==='right'){ x0=0;y0=0;x1=tw;y1=0; }
        else if(dir==='top'){ x0=0;y0=th;x1=0;y1=0; }
        else if(dir==='bottom'){ x0=0;y0=0;x1=0;y1=th; }
        else if(dir==='diag-right'){ x0=tw;y0=0;x1=0;y1=th; }
        else if(dir==='diag-left'){ x0=0;y0=0;x1=tw;y1=th; }
        else { x0=tw;y0=0;x1=0;y1=0; } // left default
        const solid=(1-f)*0.55, gone=Math.min(1,solid+0.15+f*0.55);
        const mg=tc.createLinearGradient(x0,y0,x1,y1);
        mg.addColorStop(0,'rgba(0,0,0,0)');
        mg.addColorStop(Math.max(0,Math.min(1,solid*0.3)),'rgba(0,0,0,0)');
        mg.addColorStop(Math.max(0,Math.min(1,gone)),'rgba(0,0,0,1)');
        mg.addColorStop(1,'rgba(0,0,0,1)');
        tc.globalCompositeOperation='destination-out';
        tc.fillStyle=mg; tc.fillRect(0,0,tw,th);
      }
      // 2) Stamp onto main ctx with rotation, shadow/glow and opacity.
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(rotDeg*Math.PI/180);
      ctx.globalAlpha=(opt.opacity!==undefined?opt.opacity:100)/100;
      if(opt.glow){ ctx.shadowColor=hexToRgba(opt.glowColor||'#904AFF',0.85); ctx.shadowBlur=14*FS; ctx.shadowOffsetY=0; }
      else if(opt.shadow){ ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=20*FS; ctx.shadowOffsetY=8*FS; }
      else { ctx.shadowColor='rgba(0,0,0,.30)'; ctx.shadowBlur=20*FS; ctx.shadowOffsetY=8*FS; }
      ctx.drawImage(tmp,-dw/2,-dh/2,dw,dh);
      ctx.restore();
    }

    // ── 3. TITLE ─────────────────────────────────────────────────────────────
    {
      const x=c.pos.titulo.xp/100*BW, y=c.pos.titulo.yp/100*BH;
      const sz1=c.line1Size*FS, sz2=c.line2Size*FS;
      const lh1Factor=(c.line1LH!==undefined?c.line1LH:1.15);
      // Match DOM: line-1 box height = fontSize*lineHeight, plus line-2 marginTop (4px)
      const lh1 = sz1*lh1Factor + 4*FS;
      const ff1 = c.line1Font==='Moranga'?'Moranga':'CerebriSans';
      const ff2 = c.line2Font==='Moranga'?'Moranga':'CerebriSans';

      // Measure widths for alignment
      ctx.save();
      ctx.font=(c.line1Bold?'700 ':'300 ')+sz1+'px "'+ff1+'"';
      let w1=0; c.line1Segs.forEach(s=>{if(s.text)w1+=ctx.measureText(s.text).width;});
      ctx.font='italic '+(c.line2Bold?'700 ':'400 ')+sz2+'px "'+ff2+'"';
      let w2=0; c.line2Segs.forEach(s=>{if(s.text)w2+=ctx.measureText(s.text).width;});
      ctx.restore();

      drawSegs(c.line1Segs, x, y, sz1, c.line1Font, c.line1Bold, false, 'left');

      const a2=c.line2Align||'left';
      const x2 = a2==='center' ? x+(w1-w2)/2 : a2==='right' ? x+w1-w2 : x;
      drawSegs(c.line2Segs, x2, y+lh1, sz2, c.line2Font, c.line2Bold, true, 'left');
    }


    // ── 4. DESCUENTO / PROMO ─────────────────────────────────────────────────
    if(c.mode!=='none'){
      const x=c.pos.desc.xp/100*BW, y=c.pos.desc.yp/100*BH;
      const ff = c.descFont==='Moranga'?'Moranga':'CerebriSans';
      const fw = c.descBold?'900':'700';
      if(c.mode==='porcentaje'){
        const dNS=c.descNumSize*FS, dSS=c.descSubSize*FS;
        const accent=c.descAccentColor||'#ffffff';
        // ── Measure block dimensions ──
        ctx.save();
        ctx.font=`${fw} ${dNS}px "${ff}"`;
        const numW=ctx.measureText(c.descNum).width;
        const offW=c.showOff?dNS*0.32:0;
        const sepGap=(c.showOff?dNS*0.32:6)+6;
        ctx.font=`500 ${dSS}px "${ff}"`;
        const subLines=c.descSub.split('\n');
        let subMaxW=0; subLines.forEach(l=>{const w=ctx.measureText(l).width; if(w>subMaxW)subMaxW=w;});
        ctx.restore();
        const blockW = numW + offW + sepGap + 12*FS + subMaxW;
        const blockH = dNS;
        // ── Card / pill / border ──
        // The DOM positions the card's TOP-LEFT corner at (x,y) via placeEl,
        // and the padding pushes the *content* inward by (padH, padV).
        // Replicate exactly: card at (x,y), content offset inward.
        const style=c.descCardStyle||'none';
        let ox=x, oy=y; // content origin — shifted inward when a card is present
        if(style!=='none'){
          const padV=(Math.round(c.descNumSize*0.10)+8)*FS;
          const padHbase=(Math.round(c.descNumSize*0.16)+10)*FS;
          const padH = style==='pill' ? padHbase+10*FS : padHbase; // pill has +10 horizontal (matches DOM)
          const cardX=x, cardY=y;                 // card top-left AT (x,y), like the DOM
          const cardW=blockW + padH*2;
          const cardH=blockH + padV*2;
          const rad = style==='pill'?cardH/2 : 18*FS;
          if(style==='card'){
            ctx.save(); ctx.shadowColor='rgba(0,0,0,.22)'; ctx.shadowBlur=24*FS; ctx.shadowOffsetY=6*FS;
            roundRect(cardX,cardY,cardW,cardH,rad,c.descCardColor||'#ffffff'); ctx.restore();
          } else if(style==='pill'){
            ctx.save(); ctx.shadowColor='rgba(0,0,0,.22)'; ctx.shadowBlur=24*FS; ctx.shadowOffsetY=6*FS;
            roundRect(cardX,cardY,cardW,cardH,rad,c.descCardColor||'#904AFF'); ctx.restore();
          } else if(style==='border'){
            ctx.save(); ctx.lineWidth=3*FS; ctx.strokeStyle=c.descCardColor||'#904AFF';
            ctx.beginPath();
            ctx.moveTo(cardX+rad,cardY); ctx.lineTo(cardX+cardW-rad,cardY); ctx.arcTo(cardX+cardW,cardY,cardX+cardW,cardY+rad,rad);
            ctx.lineTo(cardX+cardW,cardY+cardH-rad); ctx.arcTo(cardX+cardW,cardY+cardH,cardX+cardW-rad,cardY+cardH,rad);
            ctx.lineTo(cardX+rad,cardY+cardH); ctx.arcTo(cardX,cardY+cardH,cardX,cardY+cardH-rad,rad);
            ctx.lineTo(cardX,cardY+rad); ctx.arcTo(cardX,cardY,cardX+rad,cardY,rad);
            ctx.closePath(); ctx.stroke(); ctx.restore();
          }
          // Shift content inward by the padding, exactly like the DOM box model
          ox = x + padH;
          oy = y + padV;
        }
        // ── Content ──
        ctx.save();
        ctx.font=`${fw} ${dNS}px "${ff}"`;
        ctx.textBaseline='top';
        ctx.fillStyle=c.descNumColor;
        if(c.descBold){ctx.fillText(c.descNum,ox+0.4,oy);ctx.fillText(c.descNum,ox-0.4,oy);}
        ctx.fillText(c.descNum,ox,oy);
        if(c.showOff){
          const pctSz=dNS*0.27, offSz=dNS*0.13;
          const stackH = pctSz + 3 + offSz;
          const stackY = oy + (dNS - stackH) / 2;
          ctx.font=`${fw} ${pctSz}px "${ff}"`;
          ctx.fillText('%', ox+numW+4, stackY);
          ctx.font=`${fw} ${offSz}px "${ff}"`;
          ctx.fillText('OFF', ox+numW+4, stackY+pctSz+3);
        }
        const sepX=ox+numW+sepGap;
        // Separator line — accent color, full height of number block
        ctx.strokeStyle=accent; ctx.lineWidth=2*FS;
        ctx.beginPath(); ctx.moveTo(sepX,oy); ctx.lineTo(sepX,oy+dNS); ctx.stroke();
        // Subtext: vertically centered against number height
        ctx.font=`500 ${dSS}px "${ff}"`;
        const lineH=dSS*1.3;
        const totalSubH=subLines.length*lineH;
        const subStartY=oy+(dNS-totalSubH)/2;
        ctx.textAlign = (c.descSubAlign||'left')==='center'?'center':(c.descSubAlign==='right'?'right':'left');
        subLines.forEach((ln,i)=>{
          ctx.fillStyle=c.descSubColor;
          ctx.fillText(ln, sepX+12*FS, subStartY+i*lineH);
        });
        ctx.textAlign='left';
        ctx.restore();
      } else {
        const pf=c.promoFont==='Moranga'?'Moranga':'CerebriSans';
        const pSZ=c.promoSize*FS;
        const rad=(c.promoRadius!==undefined?c.promoRadius:12)*FS;
        ctx.save();
        ctx.font=`${c.promoBold?'700':'500'} ${pSZ}px "${pf}"`;
        const lines=c.promoText.split('\n');
        let maxW=0; lines.forEach(l=>{const w=ctx.measureText(l).width;if(w>maxW)maxW=w;});
        const padX=pSZ*0.9, padY=pSZ*0.4;
        // Fixed size overrides auto-padding (same logic as DOM)
        const bw2 = (c.promoWidth>0) ? c.promoWidth*FS : maxW+padX*2;
        const bh2 = (c.promoHeight>0) ? c.promoHeight*FS : lines.length*pSZ*1.25+padY*2;
        roundRect(x,y,bw2,bh2,rad,c.promoBg);
        ctx.fillStyle=c.promoColor;
        // Use 'middle' baseline so vertical centering matches the DOM flexbox
        // (justify-center + line-height:1.25). Each line occupies pSZ*1.25.
        ctx.textBaseline='middle';
        const lineH = pSZ*1.25;
        const totalTextH = lines.length*lineH;
        const firstLineMidY = y + (bh2-totalTextH)/2 + lineH/2;
        lines.forEach((ln,i)=>{
          const lw=ctx.measureText(ln).width;
          const lineMidY = firstLineMidY + i*lineH;
          if(c.promoBold){
            ctx.fillText(ln, x+(bw2-lw)/2+0.4, lineMidY);
            ctx.fillText(ln, x+(bw2-lw)/2-0.4, lineMidY);
          }
          ctx.fillText(ln, x+(bw2-lw)/2, lineMidY);
        });
        ctx.restore();
      }
    }

    // ── 5. LOGOS — template layout (matches DOM buildElems exactly) ──────────
    {
      const n=c.logoCount||1;
      // Spec dimensions scaled by logoSize (base = 107), matching buildElems.
      const LS = (c.logoSize||107)/107;
      const LG_W = (fmt==='mobile' ? 182 : 150) * LS;
      const LG_H = (fmt==='mobile' ? 175 : 145) * LS;
      const SM_W = (fmt==='mobile' ? 49  : 107) * LS;
      const GAP  = (c.logoGap!==undefined?c.logoGap:10);
      // Slots RELATIVE to the group origin — identical to the DOM version
      let slots;
      if(n===1){
        slots=[[0,0,LG_W,LG_H]];
      } else if(n===2){
        slots=[[0,0,SM_W,SM_W],[SM_W+GAP,0,SM_W,SM_W]];
      } else if(n===4){
        slots=[
          [0,0,SM_W,SM_W],[SM_W+GAP,0,SM_W,SM_W],
          [0,SM_W+GAP,SM_W,SM_W],[SM_W+GAP,SM_W+GAP,SM_W,SM_W]
        ];
      } else {
        slots=[
          [0,0,SM_W,SM_W],[SM_W+GAP,0,SM_W,SM_W],[SM_W*2+GAP*2,0,SM_W,SM_W],
          [0,SM_W+GAP,SM_W,SM_W],[SM_W+GAP,SM_W+GAP,SM_W,SM_W],[SM_W*2+GAP*2,SM_W+GAP,SM_W,SM_W]
        ];
      }
      // Group anchor from the draggable position (same as DOM placeEl)
      const groupX = c.pos.logos.xp/100*BW;
      const groupY = c.pos.logos.yp/100*BH;
      // Draw each logo sequentially (async) to avoid ctx state corruption
      for(let i=0;i<slots.length;i++){
        const src=c.logos[i]; if(!src) continue;
        const lx=(groupX+slots[i][0])*FS;
        const ly=(groupY+slots[i][1])*FS;
        const sw=slots[i][2]*FS;
        const sh=slots[i][3]*FS;
        await new Promise(res=>{
          const img=new Image(); img.crossOrigin='anonymous';
          img.onload=()=>{
            // White rounded box with shadow
            const r2=14*FS, pad2=8*FS;
            ctx.save();
            ctx.shadowColor='rgba(0,0,0,.22)'; ctx.shadowBlur=12; ctx.shadowOffsetY=3;
            ctx.fillStyle='#fff';
            ctx.beginPath();
            ctx.moveTo(lx+r2,ly); ctx.lineTo(lx+sw-r2,ly);
            ctx.arcTo(lx+sw,ly,lx+sw,ly+r2,r2); ctx.lineTo(lx+sw,ly+sh-r2);
            ctx.arcTo(lx+sw,ly+sh,lx+sw-r2,ly+sh,r2); ctx.lineTo(lx+r2,ly+sh);
            ctx.arcTo(lx,ly+sh,lx,ly+sh-r2,r2); ctx.lineTo(lx,ly+r2);
            ctx.arcTo(lx,ly,lx+r2,ly,r2); ctx.closePath(); ctx.fill();
            ctx.restore();
            // Logo drawn on a 3x offscreen canvas (clipped & padded), then stamped
            const SCALE=3;
            const tw2=Math.ceil(sw*SCALE), th2=Math.ceil(sh*SCALE);
            const tmp=document.createElement('canvas');
            tmp.width=tw2; tmp.height=th2;
            const tc=tmp.getContext('2d');
            const tr2=r2*SCALE, tp2=pad2*SCALE;
            tc.beginPath();
            tc.moveTo(tr2,0); tc.lineTo(tw2-tr2,0); tc.arcTo(tw2,0,tw2,tr2,tr2);
            tc.lineTo(tw2,th2-tr2); tc.arcTo(tw2,th2,tw2-tr2,th2,tr2);
            tc.lineTo(tr2,th2); tc.arcTo(0,th2,0,th2-tr2,tr2);
            tc.lineTo(0,tr2); tc.arcTo(0,0,tr2,0,tr2); tc.closePath(); tc.clip();
            tc.imageSmoothingEnabled=true; tc.imageSmoothingQuality='high';
            tc.drawImage(img,tp2,tp2,tw2-tp2*2,th2-tp2*2);
            ctx.drawImage(tmp, lx, ly, sw, sh);
            res();
          };
          img.onerror=res; img.src=src;
        });
      }
    }

    // ── 6. CTA BUTTON ─────────────────────────────────────────────────────────
    {
      const ff=c.ctaFont==='Moranga'?'Moranga':'CerebriSans';
      const fw=c.ctaBold?'700':'400';
      const ctaSZ=c.ctaSize*FS;
      // Measure text width first so the button never clips the label —
      // mirrors the DOM's minWidth + padding:'0 18px' behaviour.
      ctx.save();
      ctx.font=fw+' '+ctaSZ+'px "'+ff+'"';
      const textW = ctx.measureText(c.ctaText).width;
      ctx.restore();
      const padX = 18*FS;
      const _ctaWBase=(c.ctaWidth || (fmt==='mobile'?162:225))*FS;
      const _ctaH=(c.ctaHeight || (fmt==='mobile'?56:48))*FS;
      const _ctaW=Math.max(_ctaWBase, textW+padX*2);
      // Position from draggable c.pos.cta (top-left), same as DOM preview
      const x=c.pos.cta.xp/100*BW;
      const y=c.pos.cta.yp/100*BH;
      const r=_ctaH/2;
      // Draw pill background
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,.28)'; ctx.shadowBlur=10*FS; ctx.shadowOffsetY=2*FS;
      roundRect(x,y,_ctaW,_ctaH,r,c.ctaColor);
      ctx.restore();
      // Draw text — perfectly centered using textBaseline + textAlign
      ctx.save();
      ctx.font=fw+' '+ctaSZ+'px "'+ff+'"';
      ctx.textBaseline='middle';
      ctx.textAlign='center';
      ctx.fillStyle=c.ctaTextColor||'#fff';
      const cx=x+_ctaW/2;
      const cy=y+_ctaH/2;
      if(c.ctaBold){
        ctx.fillText(c.ctaText,cx+0.4,cy);
        ctx.fillText(c.ctaText,cx-0.4,cy);
      }
      ctx.fillText(c.ctaText,cx,cy);
      ctx.restore();
    }

    // ── 6b. PRODUCT PHOTO (inside canvas) ────────────────────────────────────
    if(c.prodImg){
      const sz=(c.prodSize||140)*FS;
      const cxp=(c.pos.prod.xp/100*BW)*FS + sz/2;
      const cyp=(c.pos.prod.yp/100*BH)*FS + sz/2;
      await new Promise(res=>{
        const img=new Image(); img.crossOrigin='anonymous';
        img.onload=()=>{
          let dw=sz, dh=sz;
          const ar=img.naturalWidth/img.naturalHeight;
          if(ar>1){ dh=sz/ar; } else { dw=sz*ar; }
          drawElementWithEffects(ctx, img, cxp, cyp, dw, dh, (c.prodRot||0), {
            shape:c.prodShape, shapeDir:c.prodShapeDir, fade:c.prodFade, fadeDir:c.prodFadeDir,
            shadow:c.prodShadow, glow:c.prodGlow, glowColor:c.prodGlowColor, opacity:c.prodOpacity, FS
          });
          res();
        };
        img.onerror=res; img.src=c.prodImg;
      });
    }

    // ── 6c. CLIENT BOX (logo co-branded) ─────────────────────────────────────
    if(c.clientImg){
      const sz=(c.clientSize||120)*FS;
      const cxp=(c.pos.client.xp/100*BW)*FS + sz/2;
      const cyp=(c.pos.client.yp/100*BH)*FS + sz/2;
      await new Promise(res=>{
        const img=new Image(); img.crossOrigin='anonymous';
        img.onload=()=>{
          const pad=10*FS, r=16*FS;
          if(c.clientBox){
            ctx.save();
            ctx.translate(cxp,cyp);
            ctx.rotate((c.clientRot||0)*Math.PI/180);
            ctx.shadowColor='rgba(0,0,0,.25)'; ctx.shadowBlur=16*FS; ctx.shadowOffsetY=4*FS;
            ctx.fillStyle='#fff';
            const x0=-sz/2,y0=-sz/2;
            ctx.beginPath();
            ctx.moveTo(x0+r,y0); ctx.lineTo(x0+sz-r,y0); ctx.arcTo(x0+sz,y0,x0+sz,y0+r,r);
            ctx.lineTo(x0+sz,y0+sz-r); ctx.arcTo(x0+sz,y0+sz,x0+sz-r,y0+sz,r);
            ctx.lineTo(x0+r,y0+sz); ctx.arcTo(x0,y0+sz,x0,y0+sz-r,r);
            ctx.lineTo(x0,y0+r); ctx.arcTo(x0,y0,x0+r,y0,r);
            ctx.closePath(); ctx.fill();
            ctx.restore();
            // logo contained inside the box (no fancy effects when boxed)
            const inset=pad, avail=sz-inset*2;
            let dw=avail, dh=avail;
            const ar=img.naturalWidth/img.naturalHeight;
            if(ar>1){ dh=avail/ar; } else { dw=avail*ar; }
            ctx.save();
            ctx.translate(cxp,cyp);
            ctx.rotate((c.clientRot||0)*Math.PI/180);
            ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
            ctx.drawImage(img,-dw/2,-dh/2,dw,dh);
            ctx.restore();
          } else {
            // No box → logo can use the full effect pipeline
            let dw=sz, dh=sz;
            const ar=img.naturalWidth/img.naturalHeight;
            if(ar>1){ dh=sz/ar; } else { dw=sz*ar; }
            drawElementWithEffects(ctx, img, cxp, cyp, dw, dh, (c.clientRot||0), {
              shape:c.clientShape, shapeDir:c.clientShapeDir, fade:c.clientFade, fadeDir:c.clientFadeDir,
              shadow:c.clientShadow, glow:c.clientGlow, glowColor:c.clientGlowColor, opacity:c.clientOpacity, FS
            });
          }
          res();
        };
        img.onerror=res; img.src=c.clientImg;
      });
    }

    // ── 6d. STARS ELEMENT ────────────────────────────────────────────────────
    if(c.starsOn){
      const box=starsClusterBox(c);
      const ox=(c.pos.stars.xp/100*BW);
      const oy=(c.pos.stars.yp/100*BH);
      ctx.save();
      // rotate around the cluster center
      ctx.translate(ox+box.w/2, oy+box.h/2);
      ctx.rotate((c.starsRot||0)*Math.PI/180);
      ctx.translate(-box.w/2,-box.h/2);
      ctx.fillStyle=c.starsColor;
      box.stars.forEach(st=>{
        ctx.globalAlpha=st.o;
        // build 5-point star path
        ctx.beginPath();
        const outer=st.s, inner=st.s*0.42, pts=5;
        for(let i=0;i<pts*2;i++){
          const r=i%2===0?outer:inner;
          const ang=(Math.PI/pts)*i - Math.PI/2;
          const x=st.x+Math.cos(ang)*r, y=st.y+Math.sin(ang)*r;
          if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.closePath(); ctx.fill();
      });
      ctx.globalAlpha=1;
      ctx.restore();
    }

    // ── 6e. ICONOS (recoloreables, arrastrables) ─────────────────────────────
    for(let i=0;i<(c.icons||[]).length;i++){
      const ic=c.icons[i];
      const key='icon'+i;
      const p=c.pos[key]||{xp:ic.xp!==undefined?ic.xp:45, yp:ic.yp!==undefined?ic.yp:40};
      const sz=(ic.size||90)*FS;
      const src=(BONDA_ICONS[ic.idx]||BONDA_ICONS[0]).data;
      await new Promise(res=>{
        const img=new Image(); img.crossOrigin='anonymous';
        img.onload=()=>{
          // contain within sz×sz
          let dw=sz, dh=sz;
          const ar=(img.naturalWidth||1)/(img.naturalHeight||1);
          if(ar>1){ dh=sz/ar; } else { dw=sz*ar; }
          const cx=(p.xp/100*BW)+sz/2, cy=(p.yp/100*BH)+sz/2;
          ctx.save();
          ctx.translate(cx,cy);
          ctx.rotate((ic.rot||0)*Math.PI/180);
          ctx.globalAlpha=(ic.opacity!==undefined?ic.opacity:100)/100;
          if(ic.color && ic.color!=='original'){
            // Recolor: draw icon into a temp canvas, then source-in a color fill
            const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));
            const tmp=document.createElement('canvas'); tmp.width=tw; tmp.height=th;
            const tc=tmp.getContext('2d');
            tc.imageSmoothingEnabled=true; tc.imageSmoothingQuality='high';
            tc.drawImage(img,0,0,tw,th);
            tc.globalCompositeOperation='source-in';
            tc.fillStyle=ic.color;
            tc.fillRect(0,0,tw,th);
            ctx.drawImage(tmp,-dw/2,-dh/2,dw,dh);
          } else {
            ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
            ctx.drawImage(img,-dw/2,-dh/2,dw,dh);
          }
          ctx.restore();
          res();
        };
        img.onerror=res; img.src=src;
      });
    }

    // ── 7. DOWNLOAD / EXPORT ─────────────────────────────────────────────────
    if(returnMode){
      // Thumbnail / preview use: return a light JPEG data URL.
      const url = out.toDataURL('image/jpeg', opts.thumbQuality || 0.6);
      if(btn){btn.textContent=prevTxt||'⬇ Descargar'; btn.disabled=false;}
      return url;
    }

    // Hard size ceiling: the destination tool rejects files over 2 MB.
    const MAX = 2 * 1024 * 1024;
    const bytesOf = (url, prefix)=> (url.length - prefix.length) * 0.75;

    let dataUrl, ext;
    if(quality==='png'){
      // Try lossless PNG first (best quality). If it exceeds the 2 MB ceiling,
      // fall back to high-quality JPEG, lowering quality then resolution until
      // it fits. This guarantees the downloaded file is always ≤ 2 MB.
      dataUrl = out.toDataURL('image/png');
      if(bytesOf(dataUrl,'data:image/png;base64,') <= MAX){
        ext='png';
      } else {
        // PNG too big → switch to JPEG quality ladder.
        ext='jpg';
        let q=0.95, fits=false;
        do{
          dataUrl = out.toDataURL('image/jpeg', q);
          if(bytesOf(dataUrl,'data:image/jpeg;base64,') <= MAX){ fits=true; break; }
          q -= 0.05;
        } while(q >= 0.55);
        // Still too big at q=0.55 → downscale the canvas and retry.
        if(!fits){
          let scale=0.85;
          while(!fits && scale>=0.4){
            const dw=Math.round(OW*scale), dh=Math.round(OH*scale);
            const tmp=document.createElement('canvas'); tmp.width=dw; tmp.height=dh;
            const tctx=tmp.getContext('2d');
            tctx.imageSmoothingEnabled=true; tctx.imageSmoothingQuality='high';
            tctx.drawImage(out,0,0,dw,dh);
            dataUrl = tmp.toDataURL('image/jpeg', 0.9);
            if(bytesOf(dataUrl,'data:image/jpeg;base64,') <= MAX) fits=true;
            else scale -= 0.1;
          }
        }
      }
    } else {
      // JPEG mode: quality ladder under the 2 MB ceiling.
      ext='jpg';
      let q=0.95, fits=false;
      do{
        dataUrl = out.toDataURL('image/jpeg', q);
        if(bytesOf(dataUrl,'data:image/jpeg;base64,') <= MAX){ fits=true; break; }
        q -= 0.05;
      } while(q >= 0.5);
      if(!fits){
        let scale=0.85;
        while(!fits && scale>=0.4){
          const dw=Math.round(OW*scale), dh=Math.round(OH*scale);
          const tmp=document.createElement('canvas'); tmp.width=dw; tmp.height=dh;
          const tctx=tmp.getContext('2d');
          tctx.imageSmoothingEnabled=true; tctx.imageSmoothingQuality='high';
          tctx.drawImage(out,0,0,dw,dh);
          dataUrl = tmp.toDataURL('image/jpeg', 0.88);
          if(bytesOf(dataUrl,'data:image/jpeg;base64,') <= MAX) fits=true;
          else scale -= 0.1;
        }
      }
    }

    const a = document.createElement('a');
    a.download = 'banner-bonda-' + fmt + (ext==='png'?'-HD':'') + '.' + ext;
    a.href = dataUrl; a.click();

  } catch(err){
    if(returnMode){ if(btn){btn.textContent=prevTxt;btn.disabled=false;} return null; }
    alert('Error: '+err.message); console.error(err);
  }
  if(btn){btn.textContent=prevTxt||'⬇ Descargar'; btn.disabled=false;}
}


// ── IMAGE COMPRESSOR (max 2MB) ───────────────────────────────────────────────
async function compressImage(dataUrl, maxBytes=1.9*1024*1024){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth, h=img.naturalHeight;

      // ── Detect transparency: sample the alpha channel ──
      let hasAlpha=false;
      try{
        const sc=document.createElement('canvas');
        const sw=Math.min(w,160), sh=Math.min(h,160);
        sc.width=sw; sc.height=sh;
        const sx=sc.getContext('2d');
        sx.drawImage(img,0,0,sw,sh);
        const data=sx.getImageData(0,0,sw,sh).data;
        for(let i=3;i<data.length;i+=4){ if(data[i]<250){ hasAlpha=true; break; } }
      }catch(e){ hasAlpha=false; }

      if(hasAlpha){
        // PNG keeps the alpha channel. PNG is lossless, so to fit the size
        // budget we shrink dimensions (not quality) until it's under maxBytes.
        const tryPng=()=>{
          const cvs=document.createElement('canvas');
          cvs.width=w; cvs.height=h;
          cvs.getContext('2d').drawImage(img,0,0,w,h);
          const out=cvs.toDataURL('image/png');
          const bytes=(out.length-'data:image/png;base64,'.length)*0.75;
          if(bytes<=maxBytes || (w<200||h<200)){ res(out); return; }
          w=Math.round(w*0.8); h=Math.round(h*0.8);
          tryPng();
        };
        tryPng();
        return;
      }

      // Opaque image → JPEG (smaller). Original behaviour.
      let q=0.92;
      const try1=()=>{
        const cvs=document.createElement('canvas');
        cvs.width=w; cvs.height=h;
        cvs.getContext('2d').drawImage(img,0,0,w,h);
        const out=cvs.toDataURL('image/jpeg',q);
        const bytes=(out.length-'data:image/jpeg;base64,'.length)*0.75;
        if(bytes<=maxBytes||q<0.1){res(out);return;}
        if(q>0.5){q-=0.1;try1();return;}
        w=Math.round(w*0.85); h=Math.round(h*0.85); q=0.7;
        try1();
      };
      try1();
    };
    img.src=dataUrl;
  });
}

// ── LEFT PANEL ────────────────────────────────────────────────────────────────
// ── HISTORIAL (localStorage, hasta 10 banners) ───────────────────────────────
const HIST_KEY = 'bonda_banner_history';
const HIST_MAX = 10;

function historyLoad(){
  try{
    const raw = localStorage.getItem(HIST_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}

function historySave_raw(items){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(items)); }catch(e){}
}

async function historyMakeThumbnail(fmt){
  // Render the banner at a small size to use as thumbnail (max ~300 wide)
  const isMob = fmt==='mobile';
  const BW = isMob ? 984 : 1166;
  const BH = isMob ? 450 : 338;
  const TW = 300, TH = Math.round(BH / BW * TW);
  const SC = TW / BW;
  return new Promise(async(resolve)=>{
    try{
      const c = C(fmt);
      await document.fonts.ready;
      const out = document.createElement('canvas');
      out.width = TW; out.height = TH;
      const ctx = out.getContext('2d');
      ctx.scale(SC, SC);
      // -- paint background --
      if(c.useGrad){
        const g=ctx.createLinearGradient(0,0,BW,0);
        g.addColorStop(0,c.bgColor||'#904AFF');g.addColorStop(1,c.bgColor2||'#6D28D9');
        ctx.fillStyle=g;
      } else {
        ctx.fillStyle = c.bgColor||'#904AFF';
      }
      ctx.fillRect(0,0,BW,BH);
      // -- title text (simple) --
      ctx.fillStyle = c.txtColor||'#ffffff';
      ctx.font = `bold ${(c.line1Size||36)*0.9}px sans-serif`;
      ctx.fillText((c.line1||'Banner'), 28, 55);
      ctx.font = `bold ${(c.line2Size||52)*0.9}px sans-serif`;
      ctx.fillText((c.line2||''), 28, 120);
      resolve(out.toDataURL('image/jpeg', 0.75));
    } catch(e){ resolve(''); }
  });
}

async function historySave(fmt){
  const items = historyLoad();
  const thumb = await historyMakeThumbnail(fmt);
  const c = C(fmt);
  // Serialize config but strip image data to keep storage lean
  const snap = JSON.parse(JSON.stringify(c));
  // Keep images only if they fit comfortably; strip if too large
  const imgKeys=['bgImg','prodImg','clientImg'];
  let totalSize = JSON.stringify(snap).length;
  // localStorage limit ~5MB; cap individual snap at ~400KB (base64)
  const CAP = 400*1024;
  imgKeys.forEach(k=>{ if(snap[k] && snap[k].length > CAP) snap[k]=''; });
  // logos can be large too
  if(snap.logos && Array.isArray(snap.logos)){
    snap.logos = snap.logos.map(l=> (l && l.length>80*1024) ? '' : l);
  }
  const now = new Date();
  const label = fmt[0].toUpperCase()+fmt.slice(1)+' · '+
    now.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+
    now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  items.unshift({fmt, label, snap, thumb, ts: now.toISOString()});
  // Keep max 10
  while(items.length > HIST_MAX) items.pop();
  historySave_raw(items);
  // Re-render the history accordion if it's open
  if(accOpen['history']) reRender();
}

function historyLoad_apply(item){
  // Load a saved config into the current format
  const fmt = item.fmt || S.editFmt;
  const target = fmt==='mobile' ? S.M : S.D;
  // Merge saved config keys (don't replace entire S.D/S.M to avoid reference issues)
  Object.assign(target, item.snap);
  S.editFmt = fmt;
  S.viewMode = fmt;
  reRender();
}

function historyDelete(idx){
  const items = historyLoad();
  items.splice(idx, 1);
  historySave_raw(items);
  reRender();
}

function historyClear(){
  if(!confirm('¿Borrar todo el historial? Esta acción no se puede deshacer.')) return;
  try{ localStorage.removeItem(HIST_KEY); }catch(e){}
  reRender();
}
