<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Generador de Banners Bonda</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#f1f5f9;min-height:100vh;color:#1f2937}
.sp::-webkit-scrollbar{width:4px}.sp::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
input[type=range]{width:100%;height:4px;appearance:none;background:#e5e7eb;border-radius:4px;cursor:pointer;accent-color:#2563eb;outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:#2563eb;cursor:pointer}
.tinp{width:100%;padding:7px 10px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;color:#111;background:#fff;outline:none;font-family:inherit}
.sinp{width:100%;padding:6px 8px;border:1px solid #e5e7eb;border-radius:8px;font-size:12px;background:#f9fafb;outline:none;color:#111}
.lbl{font-size:11px;font-weight:600;color:#6b7280;margin-bottom:4px;margin-top:8px;display:block}
.sh{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;display:block}
.tabbar{display:flex;gap:3px;background:#f3f4f6;border-radius:8px;padding:3px;margin-bottom:12px}
.tab{flex:1;padding:5px 4px;font-size:11px;font-weight:700;border:none;cursor:pointer;border-radius:6px;background:transparent;color:#9ca3af;transition:all .15s}
.tab.on{background:#fff;color:#2563eb;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.boldbtn{padding:3px 10px;font-size:13px;font-weight:900;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer;background:#f9fafb;color:#6b7280;font-family:serif;line-height:1.4;flex-shrink:0}
.boldbtn.on{background:#1e40af;color:#fff;border-color:#1e40af}
.alignbtn{padding:3px 8px;font-size:13px;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer;background:#f9fafb;color:#6b7280;line-height:1.4;flex-shrink:0}
.alignbtn.on{background:#1e40af;color:#fff;border-color:#1e40af}
.viewbtn{padding:6px 16px;font-size:12px;font-weight:700;border:none;cursor:pointer;border-radius:7px;background:transparent;color:#9ca3af;transition:all .15s}
.viewbtn.on{background:#fff;color:#2563eb;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid #e5e7eb;flex-shrink:0;transition:all .15s}
.sw.on{border:3px solid #2563eb;box-shadow:0 0 0 2px #bfdbfe}
.bel{position:absolute;cursor:move;user-select:none;z-index:50}
.bel .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:0;background:rgba(30,58,138,.9);color:#fff;font-size:9px;padding:2px 8px;border-radius:4px;white-space:nowrap;z-index:100;font-weight:700;pointer-events:none;font-family:ui-sans-serif,sans-serif}
.bel:hover .tip{display:block}
.bel.sel{outline:2px dashed rgba(37,99,235,.6);outline-offset:2px;border-radius:3px}
.pbg{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.pbox{background:#fff;border-radius:16px;padding:22px 26px;min-width:280px;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.editbar{display:flex;background:#f3f4f6;border-radius:8px;padding:3px;gap:3px;margin-bottom:16px}
.editbtn{flex:1;padding:7px 10px;font-size:12px;font-weight:700;border:none;cursor:pointer;border-radius:6px;background:transparent;color:#9ca3af;transition:all .15s}
.editbtn.on{background:#2563eb;color:#fff;box-shadow:0 1px 4px rgba(37,99,235,.4)}
/* Multicolor segment input */
.seg-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;background:#f8fafc;border-radius:8px;padding:6px 8px}
.seg-text{flex:1;padding:5px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;outline:none;font-family:inherit}
.seg-color{width:28px;height:28px;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer;padding:2px;flex-shrink:0}
.seg-del{width:22px;height:22px;border-radius:50%;background:#fee2e2;color:#dc2626;border:none;cursor:pointer;font-size:14px;line-height:1;font-weight:700;flex-shrink:0}
.seg-add{width:100%;padding:6px;background:#eff6ff;color:#2563eb;border:1px dashed #bfdbfe;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px}
/* Download hide elements */
.hide-on-dl{transition:opacity .1s}
/* Accordion */
.acc{border:1px solid #eef0f3;border-radius:11px;margin-bottom:8px;overflow:hidden;background:#fff}
.acc-h{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;background:#fafbfc;border:none;cursor:pointer;font-size:12.5px;font-weight:700;color:#374151;text-align:left}
.acc-h:hover{background:#f3f4f6}
.acc-h .chev{margin-left:auto;font-size:11px;color:#9ca3af;transition:transform .2s}
.acc.open .acc-h .chev{transform:rotate(90deg)}
.acc-h .ic{font-size:14px;width:18px;text-align:center}
.acc-b{padding:12px 13px 14px;display:none}
.acc.open .acc-b{display:block}
/* Preset chips */
.chip{padding:6px 11px;font-size:11px;font-weight:700;border:1px solid #e5e7eb;border-radius:999px;background:#f9fafb;color:#374151;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#c4b5fd;background:#f5f3ff}
.bgsw{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid #e5e7eb;flex-shrink:0}
.bgsw:hover{border-color:#904AFF}
.tplcard{border:1px solid #e5e7eb;border-radius:10px;padding:9px 8px;cursor:pointer;background:#fff;font-size:11px;font-weight:700;color:#374151;text-align:center}
.tplcard:hover{border-color:#904AFF;background:#f5f3ff}
.fxrow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fxtoggle{position:relative;width:36px;height:20px;border-radius:999px;background:#e5e7eb;cursor:pointer;flex-shrink:0;transition:background .15s}
.fxtoggle.on{background:#904AFF}
.fxtoggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.fxtoggle.on::after{left:18px}
.be-sel{outline:1.5px dashed rgba(144,74,255,.85);outline-offset:3px;border-radius:4px}
</style>
</head>

// Cada entrada: {label, family (CSS font-family), stack}. Las subidas por el
// usuario se guardan en USER_FONTS (persistidas en localStorage) y se añaden acá.
const USER_FONTS_KEY = 'bonda_user_fonts';
function loadUserFonts(){
  try{ const r=localStorage.getItem(USER_FONTS_KEY); return r?JSON.parse(r):[]; }
  catch(e){ return []; }
}
function saveUserFonts(list){
  try{ localStorage.setItem(USER_FONTS_KEY, JSON.stringify(list)); return true; }
  catch(e){ alert('No se pudo guardar la fuente: almacenamiento lleno.'); return false; }
}

function fontOptions(){
  const opts=[
    {value:'MorangaMedium', label:'★ Moranga Medium (títulos)'},
    {value:'Moranga', label:'Moranga Italic (regular)'},
    {value:'MorangaLight', label:'Moranga Italic Light'},
    {value:'MorangaBold', label:'Moranga Italic Bold'},

    {value:'CerebriSansBold', label:'Cerebri Sans Bold'},
    {value:'CerebriSansBoldIt', label:'Cerebri Sans Bold Italic'},
    {value:'TramontinaThin', label:'Tramontina Thin'},
    {value:'TramontinaLight', label:'Tramontina Light'},
    {value:'TramontinaRegular', label:'Tramontina Regular'},

// Resolve a font key to a CSS font-family stack.
function fontStack(key){
  if(!key) return 'CerebriSans,sans-serif';
  if(key.indexOf('Moranga')===0) return key+',serif';
  return key+',sans-serif';
}

async function loadFonts(){
  const jobs=[];
  const reg=(family, key, desc, mime)=>{
    try{
      const src='url(data:font/'+(mime||'woff2')+';base64,'+FONT_FILES[key]+')';
      jobs.push(new FontFace(family, src, desc||{}).load());
    }catch(e){ console.warn('Font '+family+':',e); }
  };
  try{
    // ── Cerebri Sans ──
    // Registering the REAL Bold and Bold Italic cuts under the same family means
    // font-weight:700 / font-style:italic pick the actual designed cut instead of
    // the browser faking it (synthetic bold/oblique), which looked wrong before.
    reg('CerebriSans','CEREBRI_REG',    {weight:'400', style:'normal'});
    reg('CerebriSans','CEREBRI_BOLD',   {weight:'700', style:'normal'});
    reg('CerebriSans','CEREBRI_BOLDIT', {weight:'700', style:'italic'});
    // ── Moranga ──
    // All Moranga cuts are italic BY DESIGN (italic angle -9°). Registering them
    // with style:'italic' stops the browser from slanting them a second time.
    reg('Moranga','MORANGA_MED',   {weight:'500', style:'normal'});
    reg('Moranga','MORANGA_LIGHT', {weight:'300', style:'italic'});
    reg('Moranga','MORANGA_REG',   {weight:'400', style:'italic'});
    reg('Moranga','MORANGA_BOLD',  {weight:'700', style:'italic'});
    // ── Per-cut families, so picking one in the dropdown gives exactly that cut ──
    // weight:'100 900' makes any requested weight map to this single file, so a
    // bold toggle never synthesises a fake bold on top of an already-bold cut.
    reg('CerebriSansBold',  'CEREBRI_BOLD',   {weight:'100 900', style:'normal'});
    reg('CerebriSansBoldIt','CEREBRI_BOLDIT', {weight:'100 900', style:'italic'});
    reg('MorangaMedium','MORANGA_MED',  {weight:'100 900', style:'normal'});
    reg('MorangaLight','MORANGA_LIGHT', {weight:'100 900', style:'italic'});
    reg('MorangaBold', 'MORANGA_BOLD',  {weight:'100 900', style:'italic'});
    // Tramontina family (6 cuts → separate families, each locked to its own file)
    for(const key in TRAMONTINA_FONTS){
      try{
        jobs.push(new FontFace(key,'url(data:font/ttf;base64,'+TRAMONTINA_FONTS[key]+')',{weight:'100 900'}).load());
      }catch(e){}
    }
    // User-uploaded fonts (persisted as base64 data URLs).
    loadUserFonts().forEach(f=>{
      try{ jobs.push(new FontFace(f.family, 'url('+f.data+')', {weight:'100 900'}).load()); }catch(e){}
    });
    const loaded=await Promise.all(jobs.map(p=>p.catch(e=>{console.warn('Font:',e);return null;})));
    loaded.forEach(f=>{ if(f) document.fonts.add(f); });
  }catch(e){console.warn('Font:',e);}
}

// ── CLIPS & EDGE ──────────────────────────────────────────────────────────────
function getClip(fmt){
  const c=C(fmt);
  const a=c.diagAngle!==undefined?c.diagAngle:20; // cutback %
  if(c.clipStyle==='straight'){
    return c.textSide==='right'?'polygon(0 0,100% 0,100% 100%,0 100%)':'polygon(0 0,100% 0,100% 100%,0 100%)';
  }
  if(c.textSide==='right'){
    if(c.clipStyle==='diagonal-right') return `polygon(${a}% 0,100% 0,100% 100%,0 100%)`;
    return `polygon(0 0,100% 0,100% 100%,${a}% 100%)`;
  } else {
    if(c.clipStyle==='diagonal-right') return `polygon(0 0,100% 0,${100-a}% 100%,0 100%)`;

function getEdge(fmt){
  const c=C(fmt); if(c.edgeEffect==='none')return'none';

  return({shadow:`drop-shadow(${s*8}px 0 12px rgba(0,0,0,.5))`,glow:`drop-shadow(0 0 14px rgba(255,255,255,.28)) drop-shadow(0 0 34px rgba(255,255,255,.16))`,'solid-white':`drop-shadow(${s*4}px 0 0 #fff)`})[c.edgeEffect]||'none';
}

function applyTemplate(id){
  const t=TEMPLATES.find(x=>x.id===id); if(!t)return;
  const c=E();
  // Reset new-feature flags so templates don't leave stray layers/stars from a previous one.
  c.layersOn=false; c.starsOn=false;
  c.fxGlow=false; c.fxBlobs=false; c.fxWaves=false; c.fxStars=false;
  // Side bands: turn both off by default, but KEEP any uploaded images so the
  // user doesn't lose them when switching templates.
  c.sideLeftOn=false; c.sideRightOn=false;
  c.overlayOn=false; c.extraOn=false; c.fxVignette=false; c.fxGrain=false;
  t.apply(c); reRender();
}

// ── EFFECT GEOMETRY (shared by DOM preview + canvas export) ───────────────────
// Deterministic pseudo-random so preview and export match exactly.
// ── GRAIN TILE: one deterministic noise tile shared by preview and export ────
let NOISE_TILE=null;
function noiseTile(){
  if(NOISE_TILE) return NOISE_TILE;
  try{
    const N=160, cv=document.createElement('canvas'); cv.width=N; cv.height=N;
    const cx=cv.getContext('2d');
    const id=cx.createImageData(N,N); const d=id.data;
    const rnd=seededRand(7331);
    for(let i=0;i<N*N;i++){
      const v=Math.round(rnd()*255);
      d[i*4]=v; d[i*4+1]=v; d[i*4+2]=v; d[i*4+3]=255;
    }
    cx.putImageData(id,0,0);
    NOISE_TILE=cv.toDataURL('image/png');
  }catch(e){ NOISE_TILE=''; }
  return NOISE_TILE;
}
// Vignette geometry shared by DOM and canvas: ellipse 72%/72% of the box,
// transparent until 45% of the radius, then fades to `color` at `int`.
const VIG_RXP=72, VIG_RYP=72, VIG_START=0.45; // radios en % del ancho/alto
function seededRand(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646;
  return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
// Returns star positions (in BW×BH space) given intensity.
function starField(BW,BH,intensity){
  const rnd=seededRand(7); const n=Math.round(8+intensity/100*42);
  const arr=[];
  for(let i=0;i<n;i++){
    arr.push({x:rnd()*BW, y:rnd()*BH, r:(0.6+rnd()*1.8)*(0.7+intensity/100), o:0.3+rnd()*0.6});
  }
  return arr;
}
function blobField(BW,BH,intensity){
  const rnd=seededRand(19); const n=Math.round(2+intensity/100*4);
  const arr=[];
  for(let i=0;i<n;i++){
    arr.push({x:rnd()*BW, y:rnd()*BH, r:(BH*0.25+rnd()*BH*0.45)*(0.6+intensity/100), o:0.10+intensity/100*0.22});
  }
  return arr;
}
// Wave band path data (bottom franja, brand resource)
function wavePath(BW,BH,intensity){
  const amp=BH*(0.04+intensity/100*0.10);
  const baseY=BH-amp*2-BH*(intensity/100*0.04);
  let d=`M0 ${baseY}`;
  const seg=BW/4;
  for(let i=0;i<4;i++){
    const x0=i*seg, x1=(i+1)*seg, mid=x0+seg/2;
    const up=i%2===0?-amp:amp;
    d+=` Q ${mid} ${baseY+up} ${x1} ${baseY}`;
  }
  d+=` L ${BW} ${BH} L 0 ${BH} Z`;
  return {d, baseY};
}

// ── DRAG ─────────────────────────────────────────────────────────────────────
let _drag=null;
// ── SELECTED ELEMENT (último arrastrado) → movible con las flechas del teclado ──
window.__selEl=null; // {key, fmt}
function selectEl(key,fmt){
  window.__selEl={key,fmt};
  // resaltado sutil del elemento seleccionado
  document.querySelectorAll('.be-sel').forEach(el=>el.classList.remove('be-sel'));
  const el=$('be-'+fmt+'-'+key); if(el) el.classList.add('be-sel');
}
document.addEventListener('keydown',e=>{
  const sel=window.__selEl; if(!sel) return;
  const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||document.activeElement?.isContentEditable) return;
  const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  const d=map[e.key]; if(!d) return;
  e.preventDefault();
  const c=C(sel.fmt); const p=c.pos[sel.key]; if(!p) return;
  const isMob=sel.fmt==='mobile'; const BW=isMob?984:1166, BH=isMob?450:338;
  const stepPx = e.shiftKey ? 10 : 1;                       // 1px, Shift = 10px
  p.xp = Math.max(-50, Math.min(150, p.xp + d[0]*stepPx/BW*100));
  p.yp = Math.max(-50, Math.min(150, p.yp + d[1]*stepPx/BH*100));
  reBanner(); selectEl(sel.key, sel.fmt);
});
function startDrag(e,elId,fmt){
  const isT=e.type==='touchstart';if(!isT&&e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  selectEl(elId,fmt);
  const cx=isT?e.touches[0].clientX:e.clientX;
  const cy=isT?e.touches[0].clientY:e.clientY;
  const bw=$('bw-'+fmt);if(!bw)return;
  const rect=bw.getBoundingClientRect();
  const cur=C(fmt).pos[elId];
  document.querySelectorAll('.bel').forEach(d=>d.classList.remove('sel'));
  $('be-'+fmt+'-'+elId)?.classList.add('sel');
  _drag={elId,fmt,sx:100/rect.width,sy:100/rect.height,cx,cy,px:cur.xp,py:cur.yp};
}
function onMv(e){
  if(!_drag)return;
  const isT=e.type==='touchmove';if(isT)e.preventDefault();
  const cx=isT?e.touches[0].clientX:e.clientX;
  const cy=isT?e.touches[0].clientY:e.clientY;
  const nx=_drag.px+(cx-_drag.cx)*_drag.sx;
  const ny=_drag.py+(cy-_drag.cy)*_drag.sy;
  // Clamp so elements don't go too far off-screen
  const nxp=Math.max(-30,Math.min(120,nx));
  const nyp=Math.max(-10,Math.min(110,ny));
  C(_drag.fmt).pos[_drag.elId]={xp:nxp,yp:nyp};
  const el=$('be-'+_drag.fmt+'-'+_drag.elId);
  if(el){el.style.left=nxp+'%';el.style.top=nyp+'%';}
}
function onUp(){_drag=null;}
document.addEventListener('mousemove',onMv);
document.addEventListener('mouseup',onUp);
document.addEventListener('touchmove',onMv,{passive:false});
document.addEventListener('touchend',onUp);

// ── BUILD BANNER BACKGROUND ───────────────────────────────────────────────────
function buildBg(fmt){
  const c=C(fmt);
  const isMob=fmt==='mobile'; const BW=isMob?984:1166, BH=isMob?450:338;
  const bg=mk('div');bg.id='bb-'+fmt;css(bg,{position:'absolute',inset:'0',overflow:'hidden'});

  // ── LAYERED BACKGROUND (full-bleed diagonal color bands, à la Starbucks) ──
  if(c.layersOn){
    const svgNS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox',`0 0 ${BW} ${BH}`);
    svg.setAttribute('preserveAspectRatio','none');
    css(svg,{position:'absolute',inset:'0',width:'100%',height:'100%'});
    layerBands(c,BW,BH).forEach(band=>{
      const p=document.createElementNS(svgNS,'path');
      p.setAttribute('d',band.d); p.setAttribute('fill',band.color);
      svg.appendChild(p);
    });
    bg.appendChild(svg);
  }

  // Base color fill behind the image, so wherever the image fades or blends,
  // the brand color shows through (never white/empty). When the layered
  // background is on, the LAYERS are that base — don't cover them.
  const bgColorCss = c.useGrad?`linear-gradient(to right,${c.colorA},${c.colorB})`:c.colorA;
  if(c.bgImg && !c.layersOn){
    const base=mk('div');css(base,{position:'absolute',inset:'0',background:bgColorCss});
    bg.appendChild(base);
  }

  if(c.bgImg){
    const img=mk('img');img.src=c.bgImg;
    const blendMap={multiply:'multiply',screen:'screen',overlay:'overlay','soft-light':'soft-light',luminosity:'luminosity'};
    const imgCss={position:'absolute',maxWidth:'none',width:(c.zoom*100)+'%',height:'auto',
      left:c.posX+'%',top:c.posY+'%',transform:'translate(-50%,-50%)',display:'block',
      opacity:String((c.bgImgOpacity!==undefined?c.bgImgOpacity:100)/100)};
    if(blendMap[c.bgBlend]) imgCss.mixBlendMode=blendMap[c.bgBlend];

    // "Degradado" / fade: feather the IMAGE itself to transparent toward the
    // text side using a mask. This keeps the image crisp where it matters and
    // lets it melt into the brand color — instead of painting color over it.
    if(c.bgBlend==='fade'){
      const strength=(c.bgBlendInt!==undefined?c.bgBlendInt:60)/100; // 0..1
      // The image stays fully opaque from the far edge, then fades out as it
      // approaches the text side. Larger strength = longer/softer fade.
      const solid=Math.round((1-strength)*48);            // % kept fully opaque
      const gone=Math.min(100,solid+Math.round(20+strength*55)); // % fully gone
      const ang = c.bgBlendDir==='right' ? 270
                : c.bgBlendDir==='top' ? 180
                : c.bgBlendDir==='bottom' ? 0
                : c.bgBlendDir==='diag-right' ? 315
                : c.bgBlendDir==='diag-left' ? 225
                : 90; // left (default): opaque on right, fades toward left
      // opaque far side → transparent near text side
      const m2=`linear-gradient(${ang}deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) ${solid*0.4}%, rgba(0,0,0,1) ${gone}%, rgba(0,0,0,1) 100%)`;
      imgCss.webkitMaskImage=m2; imgCss.maskImage=m2;
      imgCss.webkitMaskRepeat='no-repeat'; imgCss.maskRepeat='no-repeat';
      imgCss.webkitMaskSize='100% 100%'; imgCss.maskSize='100% 100%';
    }
    css(img,imgCss);
    bg.appendChild(img);
  }
  const pw=(c.panelW||63)+'%';
  const po=mk('div');css(po,{position:'absolute',top:'0',height:'100%',width:pw,[c.textSide==='left'?'left':'right']:'0',filter:getEdge(fmt)});
  const pi=mk('div');css(pi,{position:'relative',width:'100%',height:'100%',clipPath:getClip(fmt),overflow:'hidden',
    background:c.useGrad?`linear-gradient(to right,${c.colorA},${c.colorB})`:c.colorA});

  // ── EFFECTS OVERLAY ──
  // Normally effects live inside the color panel (clipped to it). With the
  // layered background on, there is no panel, so effects render full-bleed
  // over the whole piece (layers + image).
  const fullBleed = c.layersOn;
  const fxTarget = fullBleed ? bg : pi;          // where to attach effect nodes
  const fxW = fullBleed ? BW : (c.panelW||63)/100*BW; // effect field width
  const panelPx = fxW;
  if(c.fxGlow){
    const g=mk('div');
    const gx = fullBleed ? '50%' : (c.textSide==='left'?'30%':'70%');
    css(g,{position:'absolute',inset:'0',pointerEvents:'none',
      background:`radial-gradient(circle at ${gx} 45%, ${c.fxGlowColor}${alphaHex(0.12+c.fxGlowInt/100*0.38)} 0%, transparent 60%)`});
    fxTarget.appendChild(g);
  }
  if(c.fxBlobs || c.fxStars || c.fxWaves){
    const svgNS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox',`0 0 ${panelPx} ${BH}`);
    svg.setAttribute('preserveAspectRatio','none');
    css(svg,{position:'absolute',inset:'0',width:'100%',height:'100%',pointerEvents:'none'});
    if(c.fxBlobs){
      blobField(panelPx,BH,c.fxBlobsInt).forEach(b=>{
        const ci=document.createElementNS(svgNS,'circle');
        ci.setAttribute('cx',b.x);ci.setAttribute('cy',b.y);ci.setAttribute('r',b.r);
        ci.setAttribute('fill',c.fxBlobsColor);ci.setAttribute('opacity',b.o);
        svg.appendChild(ci);
      });
    }
    if(c.fxWaves){
      const wp=wavePath(panelPx,BH,c.fxWavesInt);
      const p=document.createElementNS(svgNS,'path');
      p.setAttribute('d',wp.d);p.setAttribute('fill',c.fxWavesColor);
      p.setAttribute('opacity',(0.12+c.fxWavesInt/100*0.20).toFixed(3));
      svg.appendChild(p);
    }
    if(c.fxStars){
      starField(panelPx,BH,c.fxStarsInt).forEach(s=>{
        const ci=document.createElementNS(svgNS,'circle');
        ci.setAttribute('cx',s.x);ci.setAttribute('cy',s.y);ci.setAttribute('r',s.r);
        ci.setAttribute('fill',c.fxStarsColor);ci.setAttribute('opacity',s.o.toFixed(2));
        svg.appendChild(ci);
      });
    }
    fxTarget.appendChild(svg);
  }

  po.appendChild(pi);
  if(!c.layersOn) bg.appendChild(po);

  // ── SIDE IMAGES (left / right bands, con efectos) ─────────────────────────
  ['left','right'].forEach(side=>{
    const s=sideCfg(c,side);
    if(!s.on || !s.imgs.length) return;
    const band=sideBandRect(s,side,BW,BH);
    // Outer container: holds the edge clip + fade mask so they apply to the
    // whole band (all panels together), matching the canvas export.
    const outer=mk('div');
    css(outer,{position:'absolute',top:'0',height:'100%',
      left:(side==='left'?'0':'auto'), right:(side==='right'?'0':'auto'),
      width:s.w+'%', overflow:'hidden'});
    const clip=sideEdgeClip(s,side);
    if(clip){ outer.style.clipPath=clip; outer.style.webkitClipPath=clip; }
    const fadeG=sideFadeGradientCss(s,side);
    if(fadeG){
      outer.style.webkitMaskImage=fadeG; outer.style.maskImage=fadeG;
      outer.style.webkitMaskSize='100% 100%'; outer.style.maskSize='100% 100%';
      outer.style.webkitMaskRepeat='no-repeat'; outer.style.maskRepeat='no-repeat';
    }
    // Gap colour shows between panels
    if(s.imgs.length>1 && s.gap>0) outer.style.background=s.gapColor;
    // Panels
    const panels=sidePanelRects({x:0,y:0,w:band.w,h:band.h}, s.imgs.length, s.gap);
    const filt=sideFilterStr(s);
    panels.forEach((p,i)=>{
      const cell=mk('div');
      css(cell,{position:'absolute',top:'0',height:'100%',
        left:(p.x/band.w*100)+'%', width:(p.w/band.w*100)+'%',
        overflow:'hidden',
        borderRadius:s.radius?s.radius+'px':'0'});
      // The image itself — background-size honours zoom, position honours focal
      const im=mk('div');
      const zoomPct = s.fit==='contain' ? ('auto '+s.zoom+'%') : (s.zoom===100?'cover':(s.zoom+'% auto'));
      css(im,{position:'absolute',inset:'0',
        backgroundImage:'url('+s.imgs[i]+')',
        backgroundSize: s.fit==='contain' ? 'contain' : (s.zoom===100?'cover':(s.zoom+'%')),
        backgroundPosition:s.posX+'% '+s.posY+'%',
        backgroundRepeat:'no-repeat',
        backgroundColor:s.fit==='contain'?'transparent':'#000',
        filter:filt});
      cell.appendChild(im);
      // Tint overlay with blend mode
      if(s.tintInt>0){
        const tint=mk('div');
        css(tint,{position:'absolute',inset:'0',background:s.tint,
          opacity:String(s.tintInt/100),
          mixBlendMode:(s.blend==='normal'?'normal':s.blend)});
        cell.appendChild(tint);
      }
      // Per-panel border
      if(s.border && s.borderW>0){
        css(cell,{boxShadow:'inset 0 0 0 '+s.borderW+'px '+s.borderColor});
      }
      outer.appendChild(cell);
    });
    bg.appendChild(outer);
  });

  // ── VIGNETTE (bordes oscurecidos suavemente) ───────────────────────────────
  if(c.fxVignette){
    const a=(c.fxVignetteInt!==undefined?c.fxVignetteInt:30)/100;
    const col=c.fxVignetteColor||'#000000';
    const v=mk('div');
    css(v,{position:'absolute',inset:'0',pointerEvents:'none',
      backgroundImage:`radial-gradient(ellipse ${VIG_RXP}% ${VIG_RYP}% at 50% 50%, ${hexToRgba(col,0)} 0%, ${hexToRgba(col,0)} ${VIG_START*100}%, ${hexToRgba(col,a)} 100%)`});
    bg.appendChild(v);
  }
  // ── GRAIN (textura fina, blend overlay) ────────────────────────────────────
  if(c.fxGrain){
    const tile=noiseTile();
    if(tile){
      const g=mk('div');
      css(g,{position:'absolute',inset:'0',pointerEvents:'none',
        backgroundImage:'url('+tile+')',backgroundRepeat:'repeat',backgroundSize:'160px 160px',
        opacity:String((c.fxGrainInt!==undefined?c.fxGrainInt:15)/100),
        mixBlendMode:'overlay'});
      bg.appendChild(g);
    }
  }
  return bg;
}
// hex alpha helper: returns 2-digit hex alpha for an 0-1 value (append to #rrggbb)
function alphaHex(a){ const v=Math.max(0,Math.min(255,Math.round(a*255))); return v.toString(16).padStart(2,'0'); }
// ── LAYERED BACKGROUND BANDS (diagonal color strips, à la Starbucks) ──────────
// Returns [{d, color}] covering the whole BW×BH. First color fills the top,
// each subsequent color is a band stacked toward the bottom with a diagonal edge.
function layerBands(c,BW,BH){
  const cols=(c.layersColors&&c.layersColors.length?c.layersColors:['#0a6b4f','#0d7d5c','#10906a','#13a378']);
  const n=cols.length;
  const slant=(c.layersAngle||8)/100*BH;   // vertical offset of the diagonal edge
  const bands=[];
  // Base: full rectangle of the first color
  bands.push({d:`M0 0 L${BW} 0 L${BW} ${BH} L0 ${BH} Z`, color:cols[0]});
  // Each next color: a band whose TOP edge is a diagonal line, filled to the bottom.
  // Bands start lower and lower so earlier colors remain visible at top.
  for(let i=1;i<n;i++){
    const frac=i/n;                          // 0..1 down the canvas
    const yTop=BH*frac;                       // nominal top of this band
    const dir = (c.layersStyle==='diagonal-left') ? -1 : 1;
    const yL = yTop + dir*slant;              // left edge y
    const yR = yTop - dir*slant;              // right edge y
    bands.push({
      d:`M0 ${yL.toFixed(1)} L${BW} ${yR.toFixed(1)} L${BW} ${BH} L0 ${BH} Z`,
      color:cols[i]
    });
  }
  return bands;
}
// hex (#rgb / #rrggbb) → rgba() string with given alpha
// ── SIDE BAND HELPERS (shared by DOM preview and canvas export) ──────────────
// Reading side config with a prefix keeps left/right symmetrical.
function sideCfg(c, side){
  const P = side==='left' ? 'sideLeft' : 'sideRight';
  const g = k => c[P+k];
  const imgs = (g('Imgs') && g('Imgs').length) ? g('Imgs') : (g('Img') ? [g('Img')] : []);
  return {
    on:g('On'), imgs,

    fade: g('Fade')||0,
    tint: g('Tint')||'#904AFF',
    tintInt: g('TintInt')||0,
    blend: g('Blend')||'normal',
    gray: g('Gray')||0,
    bright: g('Bright')!==undefined?g('Bright'):100,
    contrast: g('Contrast')!==undefined?g('Contrast'):100,
    sat: g('Sat')!==undefined?g('Sat'):100,
    gap: g('Gap')||0,
    gapColor: g('GapColor')||'#ffffff',
    zoom: g('Zoom')!==undefined?g('Zoom'):100,

    border: g('Border'), borderColor:g('BorderColor')||'#ffffff', borderW:g('BorderW')!==undefined?g('BorderW'):3
  };
}
// Band rect in BW-space.
// ── SVG → PNG NORMALIZATION ──────────────────────────────────────────────────
// Browsers render SVGs fine inside <img>, but canvas.drawImage silently draws
// NOTHING for an SVG whose root lacks width/height (naturalWidth === 0). Brand
// logos are very often exactly that kind of SVG, so exports lost them while the
// preview looked perfect. This rasterizes such SVGs to PNG.
async function normalizeSvgDataUrl(durl){
  if(!/^data:image\/svg/i.test(durl||'')) return durl;
  try{
    // Decode the SVG text (base64 or URI-encoded)
    let text;
    const b64=/^data:image\/svg\+xml(?:;charset=[^;,]*)?;base64,(.*)$/i.exec(durl);
    if(b64) text=atob(b64[1]);
    else text=decodeURIComponent(durl.replace(/^data:image\/svg\+xml(?:;charset=[^,]*)?,/i,''));
    // Aspect from viewBox (default square)
    let ar=1;
    const vb=/viewBox\s*=\s*["']\s*([\d.eE+-]+)[\s,]+([\d.eE+-]+)[\s,]+([\d.eE+-]+)[\s,]+([\d.eE+-]+)/i.exec(text);
    if(vb){ const w=parseFloat(vb[3]), h=parseFloat(vb[4]); if(w>0&&h>0) ar=w/h; }
    const TARGET=800;
    const W=ar>=1?TARGET:Math.max(1,Math.round(TARGET*ar));
    const H=ar>=1?Math.max(1,Math.round(TARGET/ar)):TARGET;
    // Inject explicit width/height on the root <svg> if missing
    let svg=text;
    if(!/<svg[^>]*\swidth\s*=/i.test(text)) svg=svg.replace(/<svg/i,'<svg width="'+W+'" height="'+H+'"');
    const svgUrl='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
    const img=await new Promise((res,rej)=>{
      const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=svgUrl;
    });
    const cw=img.naturalWidth||W, ch=img.naturalHeight||H;
    const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    const cx=cv.getContext('2d');
    cx.drawImage(img,0,0,cw,ch);
    return cv.toDataURL('image/png'); // PNG keeps transparency
  }catch(e){ console.warn('normalizeSvg:',e); return durl; }
}

// Optical (ink) left offset of a text's first glyph — e.g. the digit '1' has a
// large left side bearing, so layout-aligned text looks indented. Returns the
// px between the layout origin and the visible ink, to shift labels like HASTA.
function numInkOffset(fontCss, text){
  try{
    const cv=document.createElement('canvas');
    const cx=cv.getContext('2d');
    cx.font=fontCss;
    const m=cx.measureText(text||'');
    if(m && typeof m.actualBoundingBoxLeft==='number' && isFinite(m.actualBoundingBoxLeft)){
      return Math.max(0, -m.actualBoundingBoxLeft);
    }
  }catch(e){}
  return 0;
}

// ── LOGO SLOT LAYOUT (shared by DOM preview and canvas export) ───────────────
// Returns [[x,y,w,h], ...] for n logos. 1 logo uses the big spec size; 2+ use
// square cells in a grid. Partial rows are centred (e.g. 5 = 3 over 2).
function logoSlots(n, LG_W, LG_H, SM_W, GAP){
  if(n<=1) return [[0,0,LG_W,LG_H]];
  const COLS={2:2, 3:3, 4:2, 5:3, 6:3};
  const cols=COLS[n]||3;
  const rows=Math.ceil(n/cols);
  const step=SM_W+GAP;
  const out=[];
  for(let r=0;r<rows;r++){
    const inRow=Math.min(cols, n-r*cols);
    const offX=(cols-inRow)*step/2; // centre a partial last row
    for(let i=0;i<inRow;i++) out.push([offX+i*step, r*step, SM_W, SM_W]);
  }
  return out;
}

function sideBandRect(s, side, BW, BH){
  const w = BW*(s.w/100);
  return { x: side==='left' ? 0 : (BW-w), y:0, w, h:BH };
}
// Split the band into N panels (one per image) separated by `gap` px.
function sidePanelRects(band, n, gap){
  if(n<=1) return [{x:band.x,y:band.y,w:band.w,h:band.h}];
  const totalGap = gap*(n-1);
  const pw = (band.w-totalGap)/n;
  const out=[];
  for(let i=0;i<n;i++) out.push({x:band.x+i*(pw+gap), y:band.y, w:pw, h:band.h});
  return out;
}
// CSS filter string (identical math used for canvas ctx.filter).
function sideFilterStr(s){
  const f=[];
  if(s.gray>0) f.push('grayscale('+(s.gray/100)+')');
  if(s.bright!==100) f.push('brightness('+(s.bright/100)+')');
  if(s.contrast!==100) f.push('contrast('+(s.contrast/100)+')');
  if(s.sat!==100) f.push('saturate('+(s.sat/100)+')');
  return f.length?f.join(' '):'none';
}
// Inner-edge shape as a CSS polygon (percentages of the band box).
// 'in' cuts toward the text (angled away from the image), 'out' the opposite.
function sideEdgeClip(s, side){
  const e=s.edge, k=Math.max(0,Math.min(45,s.edgeSize));
  if(e==='straight') return '';
  if(side==='left'){
    // inner edge is the RIGHT side of the band
    if(e==='diag-in')  return `polygon(0% 0%, 100% 0%, ${100-k}% 100%, 0% 100%)`;
    if(e==='diag-out') return `polygon(0% 0%, ${100-k}% 0%, 100% 100%, 0% 100%)`;
    if(e==='arrow')    return `polygon(0% 0%, 100% 0%, ${100-k}% 50%, 100% 100%, 0% 100%)`;
    if(e==='point')    return `polygon(0% 0%, ${100-k}% 0%, 100% 50%, ${100-k}% 100%, 0% 100%)`;
  } else {
    // inner edge is the LEFT side of the band
    if(e==='diag-in')  return `polygon(${k}% 0%, 100% 0%, 100% 100%, 0% 100%)`;
    if(e==='diag-out') return `polygon(0% 0%, 100% 0%, 100% 100%, ${k}% 100%)`;
    if(e==='arrow')    return `polygon(${k}% 0%, 100% 0%, 100% 100%, ${k}% 100%, 0% 50%)`;
    if(e==='point')    return `polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, ${k}% 50%)`;
  }
  return '';
}
// Same edge shape as a canvas path (absolute coords).
function sideEdgePathCanvas(ctx, r, s, side){
  const e=s.edge, k=Math.max(0,Math.min(45,s.edgeSize))/100*r.w;
  ctx.beginPath();
  if(e==='straight'){ ctx.rect(r.x,r.y,r.w,r.h); ctx.closePath(); return; }
  const X=r.x, Y=r.y, W=r.w, H=r.h;
  if(side==='left'){
    if(e==='diag-in'){ ctx.moveTo(X,Y); ctx.lineTo(X+W,Y); ctx.lineTo(X+W-k,Y+H); ctx.lineTo(X,Y+H); }
    else if(e==='diag-out'){ ctx.moveTo(X,Y); ctx.lineTo(X+W-k,Y); ctx.lineTo(X+W,Y+H); ctx.lineTo(X,Y+H); }
    else if(e==='arrow'){ ctx.moveTo(X,Y); ctx.lineTo(X+W,Y); ctx.lineTo(X+W-k,Y+H/2); ctx.lineTo(X+W,Y+H); ctx.lineTo(X,Y+H); }
    else if(e==='point'){ ctx.moveTo(X,Y); ctx.lineTo(X+W-k,Y); ctx.lineTo(X+W,Y+H/2); ctx.lineTo(X+W-k,Y+H); ctx.lineTo(X,Y+H); }
    else { ctx.rect(X,Y,W,H); }
  } else {
    if(e==='diag-in'){ ctx.moveTo(X+k,Y); ctx.lineTo(X+W,Y); ctx.lineTo(X+W,Y+H); ctx.lineTo(X,Y+H); }
    else if(e==='diag-out'){ ctx.moveTo(X,Y); ctx.lineTo(X+W,Y); ctx.lineTo(X+W,Y+H); ctx.lineTo(X+k,Y+H); }
    else if(e==='arrow'){ ctx.moveTo(X+k,Y); ctx.lineTo(X+W,Y); ctx.lineTo(X+W,Y+H); ctx.lineTo(X+k,Y+H); ctx.lineTo(X,Y+H/2); }
    else if(e==='point'){ ctx.moveTo(X,Y); ctx.lineTo(X+W,Y); ctx.lineTo(X+W,Y+H); ctx.lineTo(X,Y+H); ctx.lineTo(X+k,Y+H/2); }
    else { ctx.rect(X,Y,W,H); }
  }
  ctx.closePath();
}
// Fade gradient direction: fades toward the inner edge (where the text is).
function sideFadeGradientCss(s, side){
  if(!s.fade) return '';
  const f=s.fade/100;
  const ang = side==='left' ? 270 : 90; // left band fades to its right; right band to its left
  // Same math as the canvas gradient (no rounding) so preview === export.
  const solid = (1-f)*70;
  const gone = Math.min(100, solid + 12 + f*50);
  return `linear-gradient(${ang}deg, rgba(0,0,0,1) 0%, rgba(0,0,0,1) ${solid.toFixed(2)}%, rgba(0,0,0,0) ${gone.toFixed(2)}%, rgba(0,0,0,0) 100%)`;
}
// Cover/contain draw rect for an image inside a panel, honouring zoom + focal point.
function sideImgDrawRect(iw, ih, panel, fit, zoom, posX, posY){
  const z=(zoom||100)/100;
  let s;
  if(fit==='contain') s=Math.min(panel.w/iw, panel.h/ih);
  else s=Math.max(panel.w/iw, panel.h/ih);
  s*=z;
  const dw=iw*s, dh=ih*s;
  // focal point: 0 → align start, 100 → align end
  const fx=(posX!==undefined?posX:50)/100, fy=(posY!==undefined?posY:50)/100;
  const dx=panel.x + (panel.w-dw)*fx;
  const dy=panel.y + (panel.h-dh)*fy;
  return {dx,dy,dw,dh};
}

function hexToRgba(hex,a){
  let h=(hex||'#000000').replace('#','');
  if(h.length===3) h=h.split('').map(x=>x+x).join('');
  const r=parseInt(h.substr(0,2),16)||0, g=parseInt(h.substr(2,2),16)||0, b=parseInt(h.substr(4,2),16)||0;
  return `rgba(${r},${g},${b},${a})`;
}

// ── ELEMENT EFFECTS (product / client image) ─────────────────────────────────
// Diagonal clip + feather/fade mask + shadow/glow + opacity. Returns a CSS obj.
// The canvas export replicates this with the SAME numeric logic (see helpers).
function elemClipPath(shape,dir){
  // Returns a CSS polygon() clip-path or '' for no clip. Diagonal cuts one side.
  if(shape!=='diagonal') return '';
  // cut amount as fraction of width
  const cut=0.22;
  if(dir==='diag-left'){
    // top-left cut down to bottom-left straight (slants ↙)
    return `polygon(0% 0%, 100% 0%, 100% 100%, ${cut*100}% 100%)`;
  }
  // diag-right (default): slants ↘
  return `polygon(${cut*100}% 0%, 100% 0%, 100% 100%, 0% 100%)`;
}
function elemFadeMask(fade,dir){
  // fade 0..100 → mask gradient that feathers the element toward `dir`.
  const f=(fade||0)/100; if(f<=0) return '';
  const ang = dir==='right' ? 270 : dir==='top' ? 180 : dir==='bottom' ? 0
            : dir==='diag-right' ? 315 : dir==='diag-left' ? 225 : 90; // left default
  const solid=Math.round((1-f)*55);
  const gone=Math.min(100,solid+Math.round(15+f*55));
  return `linear-gradient(${ang}deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) ${Math.round(solid*0.3)}%, rgba(0,0,0,1) ${gone}%, rgba(0,0,0,1) 100%)`;
}
function elemEffectCss(shape,shapeDir,fade,fadeDir,shadow,glow,glowColor,opacity){
  const o={};
  const clip=elemClipPath(shape,shapeDir);
  if(clip){ o.clipPath=clip; o.webkitClipPath=clip; }
  const mask=elemFadeMask(fade,fadeDir);
  if(mask){ o.webkitMaskImage=mask; o.maskImage=mask; o.webkitMaskSize='100% 100%'; o.maskSize='100% 100%'; o.webkitMaskRepeat='no-repeat'; o.maskRepeat='no-repeat'; }
  const filters=[];
  if(shadow) filters.push('drop-shadow(0 8px 20px rgba(0,0,0,.35))');
  if(glow)   filters.push('drop-shadow(0 0 14px '+hexToRgba(glowColor||'#904AFF',0.85)+')');
  if(!shadow && !glow) filters.push('drop-shadow(0 8px 20px rgba(0,0,0,.30))'); // default soft shadow
  o.filter=filters.join(' ');
  o.opacity=String((opacity!==undefined?opacity:100)/100);
  return o;
}

  {

    iEl.addEventListener('mousedown',e=>startDrag(e,key,fmt));

  });
