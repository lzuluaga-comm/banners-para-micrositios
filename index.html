    note.textContent='Glow, blobs y ondas se aplican dentro del panel de color (o sobre toda la pieza si activás el Fondo de capas).';
    b.appendChild(note);
    b.appendChild(fxBlock(c,'fxGlow','fxGlowInt','fxGlowColor','Glow radial'));
    b.appendChild(fxBlock(c,'fxBlobs','fxBlobsInt','fxBlobsColor','Blobs / manchas'));
    b.appendChild(fxBlock(c,'fxWaves','fxWavesInt','fxWavesColor','Ondas inferiores'));
    b.appendChild(fxBlock(c,'fxStars','fxStarsInt','fxStarsColor','Puntitos de fondo'));

    // ── Cúmulo de estrellas (elemento arrastrable) ──
    const sw=mk('div');css(sw,{marginTop:'4px',paddingTop:'10px',borderTop:'1px solid #f3f4f6'});
    const r=mk('div');r.className='fxrow';
    const tg=mk('div');tg.className='fxtoggle'+(c().starsOn?' on':'');
    const lb=mk('span');css(lb,{fontSize:'12px',fontWeight:'700',color:'#374151'});lb.textContent='Estrellitas (cúmulo)';
    tg.onclick=()=>{ c().starsOn=!c().starsOn; setTimeout(reRender,0); };
    r.appendChild(tg);r.appendChild(lb);sw.appendChild(r);
    if(c().starsOn){
      const tip=mk('p');css(tip,{fontSize:'11px',color:'#94a3b8',margin:'4px 0 8px'});
      tip.textContent='Arrastrá el cúmulo en la vista previa; doble clic = tamaño.';
      sw.appendChild(tip);
      sw.appendChild(rrw('Tamaño de estrellas',10,200,1,c().starsScale,v=>c().starsScale=v));
      sw.appendChild(rrw('Cantidad',4,120,1,c().starsCount,v=>c().starsCount=v));
      sw.appendChild(rrw('Dispersión',10,100,1,c().starsSpread,v=>c().starsSpread=v));
      sw.appendChild(rrw('Rotación',-45,45,1,c().starsRot||0,v=>c().starsRot=v));
      sw.appendChild(rrw('Opacidad',10,100,1,c().starsOpacity,v=>c().starsOpacity=v));
      const cl=mk('div');cl.appendChild(lbl('Color de las estrellas'));
      cl.appendChild(swRow(['#ffffff','#904AFF','#D877C6','#C9A9FF','#fbbf24','#121212'],c().starsColor,v=>{c().starsColor=v;}));
      cl.appendChild(cinp(c().starsColor,v=>c().starsColor=v));
      sw.appendChild(cl);
    }
    b.appendChild(sw);
  }));

  // ══ IMAGEN DE FONDO ══
  left.appendChild(acc('imagen','🖼️','Imagen de fondo',(b)=>{
    b.appendChild(lbl('Lado de la imagen'));
    b.appendChild(tabBar([['right','Imagen derecha'],['left','Imagen izquierda']],c().textSide,v=>{
      c().textSide=v;const pw=c().panelW||63;
      if(v==='right'){ c().posX=Math.round((100-pw)/2); c().posY=50; }else{ c().posX=Math.round(pw+(100-pw)/2); c().posY=50; }
      reRender();
    }));
    b.appendChild(lbl('Imagen de fondo'));
    const bf=mk('input');bf.type='file';bf.accept='image/*';css(bf,{width:'100%',fontSize:'12px',marginBottom:'12px',cursor:'pointer'});
    bf.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=async ev=>{
        const compressed=await compressImage(ev.target.result);
        const kb=Math.round((compressed.length*0.75)/1024);
        if(kb>1950){alert('La imagen es muy grande. Por favor usá una imagen más pequeña.');return;}
        c().bgImg=compressed;bf.title='Imagen lista ('+kb+' KB)';reFull();
      };
      r.readAsDataURL(f);
    };
    b.appendChild(bf);
    if(c().bgImg){
      const rm=mk('button');rm.type='button';rm.textContent='Quitar imagen de fondo';
      css(rm,{width:'100%',padding:'6px',fontSize:'11px',fontWeight:'700',background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:'7px',cursor:'pointer',marginBottom:'10px'});
      rm.onclick=()=>{c().bgImg='';reFull();};b.appendChild(rm);
    }
    const ab=mk('div');css(ab,{background:'#f8fafc',borderRadius:'10px',padding:'12px'});
    ab.appendChild(rrwFull('Zoom',0.1,3,0.05,c().zoom,v=>c().zoom=v));
    ab.appendChild(rrwFull('Posición H',-50,150,1,c().posX,v=>c().posX=v));
    ab.appendChild(rrwFull('Posición V',-50,150,1,c().posY,v=>c().posY=v));
    b.appendChild(ab);

    // ── FUSIÓN DE COLOR (imagen + color/gradiente de fondo) ──
    if(c().bgImg){
      const fb=mk('div');css(fb,{marginTop:'12px',paddingTop:'12px',borderTop:'1px solid #e5e7eb'});
      fb.appendChild(lbl('Fusión con el color de fondo'));
      const note=mk('p');css(note,{fontSize:'11px',color:'#94a3b8',marginBottom:'8px'});
      note.textContent='Fusiona la imagen con el color o gradiente que elegiste en "Estilo y Color".';
      fb.appendChild(note);
      const modes=[
        ['none','Sin fusión'],['fade','Degradado'],['multiply','Multiplicar'],
        ['screen','Aclarar'],['overlay','Superponer'],['soft-light','Luz suave'],['luminosity','Luminosidad'],
      ];
      fb.appendChild(sinp(modes,c().bgBlend||'none',v=>{c().bgBlend=v;setTimeout(reRender,0);}));
      if((c().bgBlend||'none')==='fade'){
        fb.appendChild(lbl('Dirección del degradado'));
        fb.appendChild(tabBar([['left','← Izq.'],['right','Der. →'],['diag-left','Diag. ↙'],['diag-right','Diag. ↘'],['top','↑ Arriba'],['bottom','↓ Abajo']],c().bgBlendDir||'left',v=>{c().bgBlendDir=v;setTimeout(reRender,0);}));
        fb.appendChild(rrwFull('Intensidad del degradado',0,100,1,c().bgBlendInt!==undefined?c().bgBlendInt:60,v=>c().bgBlendInt=v));
      }
      fb.appendChild(rrwFull('Opacidad de la imagen',10,100,1,c().bgImgOpacity!==undefined?c().bgImgOpacity:100,v=>c().bgImgOpacity=v));
      b.appendChild(fb);
    }
  }));

  // ══ FOTO PRODUCTO + RECUADRO CLIENTE ══
  left.appendChild(acc('prod','📦','Foto de producto y cliente',(b)=>{
    // Producto
    b.appendChild((()=>{const s=mk('div');css(s,{fontSize:'11px',fontWeight:'700',color:'#374151',marginBottom:'6px'});s.textContent='Foto de producto';return s;})());
    const pn=mk('p');css(pn,{fontSize:'11px',color:'#94a3b8',marginBottom:'6px'});
    pn.textContent='Se renderiza dentro del banner. Soporta PNG con fondo transparente. Arrastrala; doble clic = tamaño.';
    b.appendChild(pn);
    const pf=mk('input');pf.type='file';pf.accept='image/*';css(pf,{width:'100%',fontSize:'12px',marginBottom:'8px',cursor:'pointer'});
    pf.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=async ev=>{const cm=await compressImage(ev.target.result);c().prodImg=cm;reRender();};
      r.readAsDataURL(f);
    };
    b.appendChild(pf);
    if(c().prodImg){
      b.appendChild(rrw('Tamaño producto',40,600,1,c().prodSize,v=>c().prodSize=v));
      // Quick "half the banner" button
      const half=mk('button');half.type='button';half.textContent='Ocupar media pieza';
      css(half,{width:'100%',padding:'6px',fontSize:'11px',fontWeight:'700',background:'#f5f3ff',color:'#7c3aed',border:'1px solid #ddd6fe',borderRadius:'7px',cursor:'pointer',marginBottom:'8px'});
      half.onclick=()=>{ const BW=S.editFmt==='mobile'?984:1166; c().prodSize=Math.round(BW*0.5); c().pos.prod={xp:S.editFmt==='mobile'?2:50,yp:S.editFmt==='mobile'?40:8}; reRender(); };
      b.appendChild(half);
      b.appendChild(rrw('Rotación producto',-45,45,1,c().prodRot||0,v=>c().prodRot=v));
      b.appendChild(buildElemEffects('prod'));
      const rm=mk('button');rm.type='button';rm.textContent='Quitar foto de producto';
      css(rm,{width:'100%',padding:'6px',fontSize:'11px',fontWeight:'700',background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:'7px',cursor:'pointer',marginBottom:'12px'});
      rm.onclick=()=>{c().prodImg='';reRender();};b.appendChild(rm);
    }
    b.appendChild(divL());
    // Cliente
    b.appendChild((()=>{const s=mk('div');css(s,{fontSize:'11px',fontWeight:'700',color:'#374151',marginBottom:'6px'});s.textContent='Recuadro del cliente (co-branded)';return s;})());
    const cn=mk('p');css(cn,{fontSize:'11px',color:'#94a3b8',marginBottom:'6px'});
    cn.textContent='Logo del cliente dentro de la pieza. Soporta PNG transparente. Arrastralo; doble clic = tamaño.';
    b.appendChild(cn);
    const cf=mk('input');cf.type='file';cf.accept='image/*';css(cf,{width:'100%',fontSize:'12px',marginBottom:'8px',cursor:'pointer'});
    cf.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=async ev=>{const cm=await compressImage(ev.target.result);c().clientImg=cm;reRender();};
      r.readAsDataURL(f);
    };
    b.appendChild(cf);
    if(c().clientImg){
      const br=mk('div');css(br,{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'});
      const bk=mk('input');bk.type='checkbox';bk.checked=c().clientBox;bk.style.accentColor='#904AFF';
      bk.onchange=e=>{c().clientBox=e.target.checked;setTimeout(reRender,0);};
      const bl=mk('label');css(bl,{fontSize:'12px',fontWeight:'500',cursor:'pointer'});bl.textContent='Recuadro blanco detrás del logo';
      br.appendChild(bk);br.appendChild(bl);b.appendChild(br);
      b.appendChild(rrw('Tamaño cliente',40,500,1,c().clientSize,v=>c().clientSize=v));
      b.appendChild(rrw('Rotación cliente',-45,45,1,c().clientRot||0,v=>c().clientRot=v));
      if(!c().clientBox){
        const tip=mk('p');css(tip,{fontSize:'11px',color:'#94a3b8',margin:'2px 0 8px'});
        tip.textContent='Sin recuadro: podés aplicar forma, fusión y efectos.';
        b.appendChild(tip);
        b.appendChild(buildElemEffects('client'));
      }
      const rm=mk('button');rm.type='button';rm.textContent='Quitar recuadro del cliente';
      css(rm,{width:'100%',padding:'6px',fontSize:'11px',fontWeight:'700',background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:'7px',cursor:'pointer'});
      rm.onclick=()=>{c().clientImg='';reRender();};b.appendChild(rm);
    }
  }));

  // ══ ICONOS ══
  left.appendChild(acc('icons','✨','Iconos',(b)=>{
    const note=mk('p');css(note,{fontSize:'11px',color:'#94a3b8',marginBottom:'10px'});
    note.textContent='Sumá iconos, cambiales el color y arrastralos donde quieras. Doble clic sobre el icono en la vista previa = tamaño.';
    b.appendChild(note);
    // Galería de iconos disponibles
    const gal=mk('div');css(gal,{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'6px',marginBottom:'12px'});
    BONDA_ICONS.forEach((ico,idx)=>{
      const cell=mk('button');cell.type='button';cell.title=ico.name;
      css(cell,{aspectRatio:'1',border:'1px solid #e5e7eb',borderRadius:'8px',background:'#fff',cursor:'pointer',padding:'6px',display:'flex',alignItems:'center',justifyContent:'center'});
      const im=mk('img');im.src=ico.data;css(im,{width:'100%',height:'100%',objectFit:'contain'});
      cell.appendChild(im);
      cell.onclick=()=>{
        if(!c().icons) c().icons=[];
        // Nuevo icono: color violeta de marca por defecto, centrado
        c().icons.push({idx, size:90, color:'#904AFF', rot:0, opacity:100, xp:45, yp:38});
        reRender();
      };
      gal.appendChild(cell);
    });
    b.appendChild(gal);
    // Lista de iconos colocados con sus controles
    const placed=c().icons||[];
    if(!placed.length){
      const empty=mk('p');css(empty,{fontSize:'11px',color:'#cbd5e1',textAlign:'center',padding:'6px 0'});
      empty.textContent='Todavía no agregaste iconos. Tocá uno de arriba para sumarlo.';
      b.appendChild(empty);
    } else {
      placed.forEach((ic,i)=>{
        const card=mk('div');css(card,{background:'#f8fafc',borderRadius:'10px',padding:'10px',marginBottom:'8px',border:'1px solid #eef2f7'});
        const hd=mk('div');css(hd,{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'});
        const th=mk('img');th.src=(BONDA_ICONS[ic.idx]||BONDA_ICONS[0]).data;
        css(th,{width:'28px',height:'28px',objectFit:'contain',flexShrink:'0'});
        const nm=mk('span');css(nm,{fontSize:'12px',fontWeight:'700',color:'#374151',flex:'1'});
        nm.textContent=(BONDA_ICONS[ic.idx]||{}).name||('Icono '+(i+1));
        const del=mk('button');del.type='button';del.textContent='✕';del.title='Quitar';
        css(del,{padding:'4px 9px',fontSize:'11px',fontWeight:'700',background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:'6px',cursor:'pointer'});
        del.onclick=()=>{ c().icons.splice(i,1); delete c().pos['icon'+i]; reRender(); };
        hd.appendChild(th);hd.appendChild(nm);hd.appendChild(del);card.appendChild(hd);
        // Tamaño
        card.appendChild(rrw('Tamaño',20,400,1,ic.size||90,v=>{c().icons[i].size=v;}));
        // Rotación
        card.appendChild(rrw('Rotación',-180,180,1,ic.rot||0,v=>{c().icons[i].rot=v;}));
        // Opacidad
        card.appendChild(rrw('Opacidad',10,100,1,ic.opacity!==undefined?ic.opacity:100,v=>{c().icons[i].opacity=v;}));
        // Color (incluye "original" = negro del PNG)
        card.appendChild(lbl('Color'));
        card.appendChild(swRow(['#904AFF','#D877C6','#C9A9FF','#ffffff','#121212','#F3F0E9'],ic.color||'#904AFF',v=>{c().icons[i].color=v;setTimeout(reRender,0);}));
        const cin=cinp(ic.color&&ic.color!=='original'?ic.color:'#904AFF',v=>{c().icons[i].color=v;setTimeout(reRender,0);});
        card.appendChild(cin);
        // Botón para usar color original (negro tal cual)
        const orig=mk('button');orig.type='button';orig.textContent='Usar color original (negro)';
        css(orig,{width:'100%',marginTop:'6px',padding:'5px',fontSize:'11px',fontWeight:'600',background:(ic.color==='original'?'#ede9fe':'#fff'),color:'#6d28d9',border:'1px solid #ddd6fe',borderRadius:'6px',cursor:'pointer'});
        orig.onclick=()=>{c().icons[i].color='original';setTimeout(reRender,0);};
        card.appendChild(orig);
        b.appendChild(card);
      });
    }
  }));

  // ══ LOGOS PARTNER ══
  left.appendChild(acc('logos','🏷️','Logos Partner',(b)=>{
    b.appendChild(lbl('Plantilla de logos'));
    b.appendChild(tabBar([['1','1 logo'],['2','2 logos'],['4','4 logos'],['6','6 logos']],String(c().logoCount||1),v=>{c().logoCount=+v;reRender();}));
    b.appendChild(rrw('Tamaño',50,260,1,c().logoSize,v=>c().logoSize=v));
    b.appendChild(rrw('Separación',0,40,1,c().logoGap||10,v=>c().logoGap=v));
    const ll=mk('div');css(ll,{display:'flex',flexDirection:'column',gap:'6px',marginBottom:'8px'});
    const nLogos=c().logoCount||1;
    for(let i=0;i<nLogos;i++){
      const src2=c().logos[i]||null;
      const lr=mk('div');css(lr,{display:'flex',alignItems:'center',gap:'8px',background:'#f8fafc',borderRadius:'8px',padding:'7px 10px'});
      const ln=mk('span');css(ln,{fontSize:'11px',fontWeight:'600',color:'#6b7280',minWidth:'44px'});ln.textContent='Logo '+(i+1);
      const lf=mk('input');lf.type='file';lf.accept='image/*';lf.style.cssText='flex:1;font-size:11px;cursor:pointer';
      lf.onchange=(ii=>e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();r.onload=ev=>{c().logos[ii]=ev.target.result;reRender();};
        r.readAsDataURL(f);
      })(i);
      lr.appendChild(ln);lr.appendChild(lf);
      if(src2){
        const pv=mk('div');css(pv,{width:'26px',height:'26px',borderRadius:'5px',overflow:'hidden',background:'#fff',border:'1px solid #e5e7eb',flexShrink:'0'});
        const pi=mk('img');pi.src=src2;css(pi,{width:'100%',height:'100%',objectFit:'contain'});pv.appendChild(pi);lr.appendChild(pv);
      }
      const rb=mk('button');rb.textContent='×';rb.type='button';rb.title='Limpiar';
      css(rb,{width:'22px',height:'22px',borderRadius:'50%',background:'#fee2e2',color:'#dc2626',border:'none',cursor:'pointer',fontSize:'14px',lineHeight:'1',fontWeight:'700',flexShrink:'0'});
      rb.onclick=(ii=>e=>{e.preventDefault();e.stopPropagation();c().logos[ii]=null;setTimeout(reRender,0);})(i);
      lr.appendChild(rb);ll.appendChild(lr);
    }
    b.appendChild(ll);
  }));

  return left;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function render(){
  // Preserve scroll position so editing a control doesn't jump back to the top.
  const prevWinScroll = window.scrollY || window.pageYOffset || 0;
  const prevLeft = document.getElementById('left-scroll');
  const prevLeftScroll = prevLeft ? prevLeft.scrollTop : 0;
  // Remember which accordion section the user is interacting with (for focus)
  const app=$('app');app.innerHTML='';
  const root=mk('div');css(root,{maxWidth:'1220px',margin:'0 auto'});
  const hdr=mk('div');css(hdr,{marginBottom:'14px',paddingBottom:'12px',borderBottom:'1px solid #e2e8f0'});
  const h1=mk('h1');css(h1,{fontSize:'21px',fontWeight:'800',color:'#111',letterSpacing:'-0.02em'});h1.textContent='Generador de Banners Bonda';
  const sub=mk('p');css(sub,{fontSize:'12px',color:'#94a3b8',marginTop:'3px'});sub.textContent='Editá los textos y colores en el panel izquierdo';
  hdr.appendChild(h1);hdr.appendChild(sub);root.appendChild(hdr);
  const grid=mk('div');css(grid,{display:'grid',gridTemplateColumns:'310px 1fr',gap:'18px',alignItems:'start'});root.appendChild(grid);
  grid.appendChild(buildLeft());
  const right=mk('div');
  const tb=mk('div');css(tb,{background:'#fff',borderRadius:'14px',padding:'12px 16px',border:'1px solid #e2e8f0',boxShadow:'0 1px 4px rgba(0,0,0,.06)',marginBottom:'14px',display:'flex',alignItems:'center',justifyContent:'space-between'});
  const vb=mk('div');css(vb,{display:'flex',background:'#f3f4f6',borderRadius:'10px',padding:'3px'});
  ['desktop','mobile','both'].forEach(v=>{
    const b=mk('button');b.type='button';b.className='viewbtn'+(S.viewMode===v?' on':'');
    b.textContent=v==='both'?'Ambos':v[0].toUpperCase()+v.slice(1);
    b.onclick=()=>{S.viewMode=v;if(v!=='both')S.editFmt=v;reRender();};
    vb.appendChild(b);
  });
  const ht=mk('p');css(ht,{fontSize:'11px',color:'#94a3b8'});ht.textContent='Arrastrá · Doble clic = tamaño';
  tb.appendChild(vb);tb.appendChild(ht);right.appendChild(tb);
  const bl=mk('div');css(bl,{display:'flex',flexDirection:'column',gap:'20px'});right.appendChild(bl);
  const fmts=S.viewMode==='both'?['desktop','mobile']:[S.viewMode];
  fmts.forEach(fmt=>{
    const wrap=mk('div');
    const br=mk('div');css(br,{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px',padding:'0 4px'});
    const blab=mk('span');css(blab,{fontSize:'10px',fontWeight:'700',color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.08em'});
    blab.textContent=fmt==='mobile'?'Mobile: 984×450 px':'Desktop: 1166×338 px';
    const btns=mk('div');css(btns,{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'});
    const db=mk('button');db.id='dl-'+fmt;db.type='button';db.textContent='⬇ Descargar (HD, máx 2MB)';
    css(db,{background:'#16a34a',color:'#fff',border:'none',borderRadius:'10px',padding:'8px 16px',fontSize:'12px',fontWeight:'700',cursor:'pointer'});
    db.onclick=()=>dlBanner(fmt,'png');
    const dbj=mk('button');dbj.type='button';dbj.textContent='JPG';dbj.title='Descargar JPG de alta calidad (siempre ≤2MB)';
    css(dbj,{background:'#f0fdf4',color:'#16a34a',border:'1px solid #bbf7d0',borderRadius:'10px',padding:'8px 12px',fontSize:'12px',fontWeight:'700',cursor:'pointer'});
    dbj.onclick=()=>dlBanner(fmt,'hd');
    // ── Guardar en historial ──
    const sv=mk('button');sv.type='button';sv.textContent='💾 Guardar';sv.title='Guardar este banner en el historial (se guarda en este navegador)';
    css(sv,{background:'#f5f3ff',color:'#7c3aed',border:'1px solid #ddd6fe',borderRadius:'10px',padding:'8px 12px',fontSize:'12px',fontWeight:'700',cursor:'pointer'});
    sv.onclick=async()=>{
      sv.textContent='Guardando...'; sv.disabled=true;
      await historySave(fmt);
      sv.textContent='✓ Guardado!'; setTimeout(()=>{sv.textContent='💾 Guardar';sv.disabled=false;},1500);
    };
    btns.appendChild(db);btns.appendChild(dbj);btns.appendChild(sv);
    br.appendChild(blab);br.appendChild(btns);wrap.appendChild(br);
    const shell=mk('div');css(shell,{borderRadius:'14px',boxShadow:'0 4px 24px rgba(0,0,0,.12)',border:'1px solid #e2e8f0',position:'relative'});
    shell.appendChild(buildBanner(fmt));
    wrap.appendChild(shell);bl.appendChild(wrap);
  });
  grid.appendChild(right);app.appendChild(root);
  // Restore scroll positions (window + left panel) so the view doesn't jump.
  const newLeft=document.getElementById('left-scroll');
  if(newLeft) newLeft.scrollTop=prevLeftScroll;
  window.scrollTo(0, prevWinScroll);
}

window.addEventListener('DOMContentLoaded',async()=>{await loadFonts();render();});
</script>
